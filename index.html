<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Restaurant</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
background:#f4f5f7;
color:#222;
padding-bottom:95px;
}
button,input{font:inherit}

.header{
background:linear-gradient(135deg,#111,#292929);
color:#fff;
padding:22px 16px 18px;
box-shadow:0 5px 20px rgba(0,0,0,.16);
}
.header-inner{
max-width:1000px;
margin:auto;
text-align:center;
}
.restaurant-name{
font-size:28px;
font-weight:800;
letter-spacing:.2px;
}
.table-badge{
display:inline-flex;
align-items:center;
gap:7px;
margin-top:9px;
background:#ffffff14;
border:1px solid #ffffff18;
padding:8px 13px;
border-radius:30px;
font-size:13px;
color:#ddd;
}
.header-actions{
display:flex;
justify-content:center;
gap:8px;
margin-top:14px;
}
.header-btn{
border:1px solid #ffffff22;
background:#fff;
color:#111;
padding:10px 14px;
border-radius:10px;
font-weight:700;
cursor:pointer;
}

.container{
max-width:1000px;
margin:auto;
padding:17px;
}

.status{
text-align:center;
font-size:12px;
color:#777;
margin-bottom:12px;
}

.search{
width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:14px;
font-size:15px;
background:#fff;
outline:none;
box-shadow:0 2px 10px rgba(0,0,0,.03);
}
.search:focus{border-color:#111}

.categories{
display:flex;
gap:8px;
overflow-x:auto;
padding:13px 0 17px;
}
.categories::-webkit-scrollbar{display:none}
.category{
white-space:nowrap;
padding:9px 15px;
background:#fff;
border:1px solid #ddd;
border-radius:22px;
font-size:13px;
cursor:pointer;
}
.category.active{
background:#111;
color:#fff;
border-color:#111;
}

.food-card{
background:#fff;
border-radius:18px;
overflow:hidden;
margin-bottom:16px;
box-shadow:0 4px 18px rgba(0,0,0,.07);
}
.food-image{
width:100%;
height:200px;
object-fit:cover;
display:block;
background:#eee;
}
.food-content{padding:16px}
.food-name{
font-size:19px;
font-weight:800;
}
.food-description{
font-size:13px;
color:#777;
line-height:1.45;
margin-top:7px;
min-height:37px;
}
.food-bottom{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-top:15px;
}
.price{
font-size:19px;
font-weight:800;
}
.add-btn{
border:0;
background:#111;
color:#fff;
padding:10px 17px;
border-radius:10px;
font-weight:700;
cursor:pointer;
}

.cart-bar{
position:fixed;
left:15px;
right:15px;
bottom:15px;
z-index:1000;
background:#111;
color:#fff;
padding:15px 17px;
border-radius:16px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 8px 30px rgba(0,0,0,.28);
cursor:pointer;
}
.cart-count{font-weight:800}
.cart-total{font-weight:800}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.48);
backdrop-filter:blur(3px);
display:none;
z-index:2000;
}
.drawer{
position:fixed;
top:0;
right:0;
width:min(520px,95vw);
height:100vh;
background:#f5f5f5;
transform:translateX(100%);
transition:.3s ease;
z-index:2001;
display:flex;
flex-direction:column;
box-shadow:-12px 0 35px rgba(0,0,0,.2);
}
.drawer.open{transform:translateX(0)}
.drawer-head{
background:#111;
color:#fff;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
}
.drawer-head h2{font-size:20px}
.drawer-head p{
font-size:11px;
color:#aaa;
margin-top:4px;
}
.close{
border:0;
width:38px;
height:38px;
border-radius:50%;
background:#fff;
color:#111;
font-size:22px;
cursor:pointer;
}
.drawer-body{
flex:1;
overflow:auto;
padding:15px;
}
.cart-item,
.order-card{
background:#fff;
border-radius:14px;
padding:14px;
margin-bottom:10px;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}
.cart-item{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}
.qty{
display:flex;
align-items:center;
gap:8px;
}
.qty button{
width:30px;
height:30px;
border:0;
border-radius:8px;
background:#111;
color:#fff;
cursor:pointer;
}
.cart-line{
font-size:12px;
color:#777;
margin-top:5px;
}
.drawer-foot{
background:#fff;
padding:16px;
border-top:1px solid #eee;
}
.total-row{
display:flex;
justify-content:space-between;
font-size:19px;
font-weight:800;
}
.place-btn{
width:100%;
border:0;
background:#198754;
color:#fff;
padding:14px;
border-radius:11px;
margin-top:12px;
font-weight:800;
cursor:pointer;
}

.bill-box{
background:linear-gradient(135deg,#111,#292929);
color:#fff;
padding:16px;
border-radius:15px;
margin-bottom:13px;
display:flex;
justify-content:space-between;
align-items:center;
}
.bill-box small{
font-size:10px;
color:#aaa;
display:block;
}
.bill-box strong{font-size:24px}
.order-top{
display:flex;
justify-content:space-between;
gap:10px;
align-items:flex-start;
}
.order-id{
font-size:13px;
font-weight:800;
}
.order-status{
font-size:11px;
color:#777;
margin-top:4px;
}
.source{
padding:6px 9px;
border-radius:20px;
font-size:10px;
font-weight:800;
white-space:nowrap;
}
.customer{
background:#d1e7dd;
color:#0f5132;
}
.waiter{
background:#cff4fc;
color:#055160;
}
.order-items{
border-top:1px solid #eee;
border-bottom:1px solid #eee;
padding:9px 0;
margin:10px 0;
}
.order-line{
display:flex;
justify-content:space-between;
gap:10px;
font-size:13px;
padding:4px 0;
}
.order-total{
display:flex;
justify-content:space-between;
font-weight:800;
}
.order-time{
font-size:10px;
color:#888;
margin-top:8px;
}

.empty,.loading{
padding:35px 10px;
text-align:center;
color:#777;
}
.error-box{
background:#f8d7da;
color:#842029;
padding:14px;
border-radius:10px;
line-height:1.5;
}

@media(max-width:600px){
.food-image{height:190px}
.drawer{width:100vw}
}
</style>
</head>

<body>

<div class="header">
<div class="header-inner">

<div class="restaurant-name">🍽️ My Restaurant</div>

<div class="table-badge">
🪑 <span id="tableNumber">Table No. 5</span>
</div>

<div class="header-actions">
<button class="header-btn" onclick="openOrders()">📋 My Orders</button>
</div>

</div>
</div>

<div class="container">

<div class="status" id="status">
🔄 Starting website...
</div>

<input
id="searchInput"
class="search"
placeholder="🔍 Search food..."
>

<div id="categories" class="categories"></div>

<div id="foodList">
<div class="loading">🍽️ Loading menu...</div>
</div>

</div>


<!-- CART -->

<div id="cartBar" class="cart-bar" onclick="openCart()">
<div class="cart-count" id="cartCount">🛒 Cart (0)</div>
<div class="cart-total" id="cartTotal">₹0</div>
</div>

<div id="overlay" class="overlay" onclick="closeDrawers()"></div>


<div id="cartDrawer" class="drawer">

<div class="drawer-head">
<div>
<h2>🛒 Your Cart</h2>
<p>Review your order</p>
</div>
<button class="close" onclick="closeCart()">×</button>
</div>

<div id="cartList" class="drawer-body"></div>

<div class="drawer-foot">
<div class="total-row">
<span>Total</span>
<span id="drawerCartTotal">₹0</span>
</div>

<button class="place-btn" onclick="placeOrder()">
🍽️ Place Order
</button>
</div>

</div>


<!-- MY ORDERS -->

<div id="ordersDrawer" class="drawer">

<div class="drawer-head">
<div>
<h2>📋 My Orders</h2>
<p id="ordersSubtitle">Current table session</p>
</div>
<button class="close" onclick="closeOrders()">×</button>
</div>

<div class="drawer-body">

<div class="bill-box">
<div>
<small>CURRENT TABLE BILL</small>
<div id="orderCountText">0 active orders</div>
</div>
<strong id="currentBill">₹0</strong>
</div>

<div id="myOrdersList">
<div class="loading">Loading orders...</div>
</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL="https://jxjrcjmrkhknltwvzzvr.supabase.co";
const SUPABASE_KEY="sb_publishable__Pg5UNoizrSpZB3fRvbARw_fNhHGjvl";

const db=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let menuItems=[];
let cart=[];
let selectedCategory="All";
let currentTable="5";
let orderTimer=null;

const statusBox=document.getElementById("status");

function setStatus(text){
statusBox.innerText=text;
}

function loadTableNumber(){

const table=new URLSearchParams(
window.location.search
).get("table");

if(table){
currentTable=table;
document.getElementById("tableNumber").innerText=
"Table No. "+table;
}

}

function displayMenu(items){

const box=document.getElementById("foodList");

box.innerHTML="";

if(!items.length){
box.innerHTML='<div class="empty">😕 No food found.</div>';
return;
}

items.forEach(item=>{

box.innerHTML+=`

<div class="food-card">

<img
class="food-image"
src="${item.image}"
alt="${item.name}"
onerror="this.src='https://via.placeholder.com/800x500?text=Food'"
>

<div class="food-content">

<div class="food-name">${item.name}</div>

<div class="food-description">${item.description}</div>

<div class="food-bottom">

<div class="price">₹${item.price}</div>

<button
class="add-btn"
onclick="addToCart(${item.id})"
>
+ Add
</button>

</div>

</div>

</div>
`;

});
}

function createCategories(){

const box=document.getElementById("categories");

box.innerHTML="";

const all=document.createElement("div");

all.className="category active";
all.innerText="All";
all.onclick=()=>filterCategory("All",all);

box.appendChild(all);

[
...new Set(
menuItems.map(x=>x.category).filter(Boolean)
)
].forEach(category=>{

const b=document.createElement("div");

b.className="category";
b.innerText=category;
b.onclick=()=>filterCategory(category,b);

box.appendChild(b);

});
}

function filterCategory(category,button){

selectedCategory=category;

document.querySelectorAll(".category")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

searchFood();

}

function searchFood(){

const text=document.getElementById("searchInput")
.value.toLowerCase().trim();

let filtered=menuItems.filter(x=>
x.name.toLowerCase().includes(text)
);

if(selectedCategory!=="All"){
filtered=filtered.filter(x=>
x.category===selectedCategory
);
}

displayMenu(filtered);

}

async function loadMenu(){

setStatus("🔄 Loading menu...");

try{

const {data,error}=await db
.from("menu_items")
.select("*")
.order("id",{ascending:true});

if(error)throw error;

menuItems=(data||[]).map(x=>({
id:x.id,
name:x.name,
price:Number(x.price),
category:x.category||"Other",
description:x.description||"",
image:x.image_url||
"https://via.placeholder.com/800x500?text=Food"
}));

createCategories();
displayMenu(menuItems);

setStatus("✅ Menu ready");

}catch(error){

setStatus("❌ Menu error");

document.getElementById("foodList").innerHTML=`
<div class="error-box">
❌ Menu load nahi hua.
<br><br>
${error.message}
</div>`;
}
}

function addToCart(id){

const item=menuItems.find(x=>x.id===id);

if(!item)return;

const old=cart.find(x=>x.id===id);

if(old){
old.quantity++;
}else{
cart.push({
id:item.id,
name:item.name,
price:item.price,
quantity:1
});
}

renderCart();

}

function changeQty(index,change){

if(!cart[index])return;

cart[index].quantity+=change;

if(cart[index].quantity<=0){
cart.splice(index,1);
}

renderCart();

}

function renderCart(){

const box=document.getElementById("cartList");

let total=0;
let count=0;

if(!cart.length){

box.innerHTML=
'<div class="empty">🛒 Cart empty hai.</div>';

}else{

box.innerHTML="";

cart.forEach((item,index)=>{

const itemTotal=
item.price*item.quantity;

total+=itemTotal;
count+=item.quantity;

box.innerHTML+=`

<div class="cart-item">

<div>
<strong>${item.name}</strong>

<div class="cart-line">
₹${item.price} × ${item.quantity}
= ₹${itemTotal}
</div>
</div>

<div class="qty">

<button onclick="changeQty(${index},-1)">−</button>

<span>${item.quantity}</span>

<button onclick="changeQty(${index},1)">+</button>

</div>

</div>
`;

});

}

document.getElementById("cartCount").innerText=
"🛒 Cart ("+count+")";

document.getElementById("cartTotal").innerText=
"₹"+total;

document.getElementById("drawerCartTotal").innerText=
"₹"+total;

document.getElementById("cartBar").style.display=
count?"flex":"none";

}

function openCart(){

closeOrders();

document.getElementById("cartDrawer").classList.add("open");
document.getElementById("overlay").style.display="block";

}

function closeCart(){

document.getElementById("cartDrawer").classList.remove("open");

if(
!document.getElementById("ordersDrawer").classList.contains("open")
){
document.getElementById("overlay").style.display="none";
}

}

async function placeOrder(){

if(!cart.length){
alert("Cart empty hai bhai 😅");
return;
}

let total=0;

cart.forEach(x=>{
total+=x.price*x.quantity;
});

const items=cart.map(x=>({
id:x.id,
name:x.name,
price:x.price,
quantity:x.quantity
}));

setStatus("🔄 Placing order...");

try{

const {error}=await db.rpc(
"create_customer_order",
{
p_table_number:currentTable,
p_items:items,
p_total_amount:total
}
);

if(error)throw error;

cart=[];
renderCart();
closeCart();

alert("✅ Order placed successfully! 🍽️");

setStatus("✅ Order placed");

}catch(error){

alert(
"❌ Order place nahi hua:\n"+
error.message
);

setStatus("❌ Order failed");

}

}

async function loadMyOrders(){

const box=document.getElementById("myOrdersList");

box.innerHTML=
'<div class="loading">Loading orders...</div>';

try{

const {data,error}=await db
.from("orders")
.select("*")
.eq("table_number",String(currentTable))
.neq("payment_status","paid")
.order("created_at",{ascending:false});

if(error)throw error;

const orders=data||[];

let bill=0;

orders.forEach(x=>{
bill+=Number(x.total_amount)||0;
});

document.getElementById("currentBill").innerText=
"₹"+bill;

document.getElementById("orderCountText").innerText=
orders.length+
" active order"+
(orders.length===1?"":"s");

document.getElementById("ordersSubtitle").innerText=
"Table "+currentTable+" • Current session";

if(!orders.length){

box.innerHTML=`
<div class="empty">
✅ No active orders.<br><br>
Payment complete hone ke baad session clear ho gaya.
</div>`;
return;
}

box.innerHTML="";

orders.forEach(order=>{

let items=order.items;

if(typeof items==="string"){
try{items=JSON.parse(items)}catch(e){items=[]}
}

let lines="";

if(Array.isArray(items)){

items.forEach(item=>{

lines+=`
<div class="order-line">
<span>${item.name} × ${item.quantity||1}</span>
<span>₹${Number(item.price)*Number(item.quantity||1)}</span>
</div>`;
});

}

const isWaiter=
order.order_source==="waiter";

const sourceClass=
isWaiter?"waiter":"customer";

const sourceText=
isWaiter
?
"🔵 WAITER"+(order.waiter_name?
" • "+order.waiter_name:"")
:
"🟢 CUSTOMER";

box.innerHTML+=`

<div class="order-card">

<div class="order-top">

<div>

<div class="order-id">
Order #${order.id}
</div>

<div class="order-status">
${String(order.status||"pending").toUpperCase()}
</div>

</div>

<div class="source ${sourceClass}">
${sourceText}
</div>

</div>

<div class="order-items">
${lines}
</div>

<div class="order-total">
<span>Total</span>
<span>₹${order.total_amount||0}</span>
</div>

<div class="order-time">
🕒 ${
order.created_at
?new Date(order.created_at).toLocaleString("en-IN")
:""
}
</div>

</div>
`;

});

}catch(error){

box.innerHTML=`
<div class="error-box">
❌ My Orders load nahi hua.
<br><br>
${error.message}
</div>`;
}

}

function openOrders(){

closeCart();

document.getElementById("ordersDrawer").classList.add("open");
document.getElementById("overlay").style.display="block";

loadMyOrders();

clearInterval(orderTimer);
orderTimer=setInterval(loadMyOrders,8000);

}

function closeOrders(){

document.getElementById("ordersDrawer").classList.remove("open");

if(
!document.getElementById("cartDrawer").classList.contains("open")
){
document.getElementById("overlay").style.display="none";
}

clearInterval(orderTimer);

}

function closeDrawers(){

closeCart();
closeOrders();

document.getElementById("overlay").style.display="none";

}

document.getElementById("searchInput")
.addEventListener("input",searchFood);

loadTableNumber();
renderCart();
loadMenu();

</script>

</body>
</html>
