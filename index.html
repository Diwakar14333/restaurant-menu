<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Restaurant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#f6f6f6;color:#222;padding-bottom:90px}
.header{background:#111;color:#fff;text-align:center;padding:22px 15px}
.restaurant-name{font-size:26px;font-weight:bold}
.table-number{margin-top:6px;color:#ccc;font-size:14px}
.container{padding:15px}
.status{text-align:center;color:#777;font-size:13px;margin-bottom:12px}
.search{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin-bottom:16px}
.categories{display:flex;gap:10px;overflow-x:auto;margin-bottom:20px}
.category{white-space:nowrap;padding:10px 17px;background:#fff;border:1px solid #ddd;border-radius:25px;font-size:14px}
.category.active{background:#111;color:#fff}
.food-card{background:#fff;border-radius:15px;margin-bottom:16px;overflow:hidden;box-shadow:0 3px 12px #00000014}
.food-image{width:100%;height:190px;object-fit:cover;display:block}
.food-content{padding:15px}
.food-name{font-size:19px;font-weight:bold}
.food-description{color:#777;font-size:14px;line-height:1.4;margin-top:7px}
.food-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.price{font-size:19px;font-weight:bold}
.add-btn,.quantity button,.place-btn{background:#111;color:#fff;border:0;border-radius:9px;cursor:pointer}
.add-btn{padding:10px 20px}
.cart{position:fixed;bottom:15px;left:15px;right:15px;background:#111;color:#fff;padding:16px;border-radius:13px;display:flex;justify-content:space-between;z-index:1000}
.cart-items{display:none;position:fixed;bottom:82px;left:15px;right:15px;background:#fff;border-radius:15px;padding:18px;max-height:60vh;overflow-y:auto;box-shadow:0 0 25px #0004;z-index:999}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
.cart-item-name{font-weight:bold}
.cart-item-price{color:#666;font-size:13px;margin-top:4px}
.quantity{display:flex;align-items:center;gap:9px}
.quantity button{width:30px;height:30px;font-size:18px}
.place-btn{width:100%;padding:14px;margin-top:18px;font-size:16px;font-weight:bold}
.empty-cart,.no-result,.loading{text-align:center;color:#777;padding:25px}
.no-result{display:none}
.error-box{background:#f8d7da;color:#842029;padding:15px;border-radius:10px}
</style>
</head>

<body>

<div class="header">
<div class="restaurant-name">🍽️ My Restaurant</div>
<div class="table-number" id="tableNumber">Table No. 5</div>
</div>

<div class="container">
<div class="status" id="status">🔄 Starting...</div>

<input class="search" id="searchInput" placeholder="🔍 Search food...">

<div class="categories" id="categories">
<div class="category active">All</div>
</div>

<div id="foodList">
<div class="loading">Loading menu... 🍽️</div>
</div>

<div class="no-result" id="noResult">No food found 😕</div>
</div>

<div class="cart-items" id="cartItems">
<h2>🛒 Your Cart</h2>
<div id="cartList"></div>
</div>

<div class="cart" id="cartButton">
<div id="cartCount">🛒 Cart (0)</div>
<div id="cartTotal">₹0</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL="https://jxjrcjmrkhknltwvzzvr.supabase.co";
const SUPABASE_KEY="sb_publishable__Pg5UNoizrSpZB3fRvbARw_fNhHGjvl";

let db;
let menuItems=[];
let cart=[];
let selectedCategory="All";

const statusBox=document.getElementById("status");

function setStatus(x){statusBox.innerText=x}

function loadTableNumber(){
const table=new URLSearchParams(location.search).get("table");
if(table)document.getElementById("tableNumber").innerText="Table No. "+table;
}

function displayMenu(items){
const list=document.getElementById("foodList");
const no=document.getElementById("noResult");
list.innerHTML="";

if(!items.length){no.style.display="block";return}
no.style.display="none";

items.forEach(item=>{
const card=document.createElement("div");
card.className="food-card";
card.innerHTML=`
<img src="${item.image}" class="food-image" alt="${item.name}">
<div class="food-content">
<div class="food-name">${item.name}</div>
<div class="food-description">${item.description}</div>
<div class="food-bottom">
<div class="price">₹${item.price}</div>
<button class="add-btn" onclick="addToCart(${item.id})">+ Add</button>
</div>
</div>`;
list.appendChild(card);
});
}

function createCategories(){
const box=document.getElementById("categories");
box.innerHTML="";

["All",...new Set(menuItems.map(x=>x.category).filter(Boolean))].forEach(cat=>{
const b=document.createElement("div");
b.className="category"+(cat==="All"?" active":"");
b.innerText=cat;
b.onclick=()=>filterCategory(cat,b);
box.appendChild(b);
});
}

async function loadMenu(){
setStatus("🔄 Connecting to menu database...");

try{
db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const {data,error}=await db.from("menu_items").select("*").order("id",{ascending:true});

if(error)throw error;

menuItems=(data||[]).map(x=>({
id:x.id,
name:x.name,
price:Number(x.price),
category:x.category||"Other",
description:x.description||"",
image:x.image_url||"https://via.placeholder.com/800x500?text=Food"
}));

createCategories();
displayMenu(menuItems);
setStatus("✅ Menu loaded — "+menuItems.length+" item(s)");

}catch(e){
console.error(e);
setStatus("❌ Database error");
document.getElementById("foodList").innerHTML=
`<div class="error-box">❌ ${e.message}</div>`;
}
}

function searchFood(){
const text=document.getElementById("searchInput").value.toLowerCase().trim();

let items=menuItems.filter(x=>x.name.toLowerCase().includes(text));

if(selectedCategory!=="All")
items=items.filter(x=>x.category===selectedCategory);

displayMenu(items);
}

function filterCategory(cat,button){
selectedCategory=cat;
document.querySelectorAll(".category").forEach(x=>x.classList.remove("active"));
button.classList.add("active");
searchFood();
}

function addToCart(id){
const item=menuItems.find(x=>x.id===id);
if(!item)return;

const existing=cart.find(x=>x.id===id);

if(existing)existing.quantity++;
else cart.push({id:item.id,name:item.name,price:item.price,quantity:1});

updateCart();
}

function increaseQuantity(i){
if(cart[i])cart[i].quantity++;
updateCart();
}

function decreaseQuantity(i){
if(!cart[i])return;
cart[i].quantity--;
if(cart[i].quantity<=0)cart.splice(i,1);
updateCart();
}

function updateCart(){
let count=0,total=0;

cart.forEach(x=>{
count+=x.quantity;
total+=x.price*x.quantity;
});

document.getElementById("cartCount").innerText="🛒 Cart ("+count+")";
document.getElementById("cartTotal").innerText="₹"+total;

const list=document.getElementById("cartList");

if(!cart.length){
list.innerHTML='<div class="empty-cart">Your cart is empty</div>';
return;
}

list.innerHTML="";

cart.forEach((x,i)=>{
list.innerHTML+=`
<div class="cart-item">
<div>
<div class="cart-item-name">${x.name}</div>
<div class="cart-item-price">₹${x.price*x.quantity}</div>
</div>
<div class="quantity">
<button onclick="decreaseQuantity(${i})">−</button>
<span>${x.quantity}</span>
<button onclick="increaseQuantity(${i})">+</button>
</div>
</div>`;
});

list.innerHTML+=`
<button class="place-btn" onclick="placeOrder()">
🍽️ Place Order
</button>`;
}

function toggleCart(){
const box=document.getElementById("cartItems");
box.style.display=box.style.display==="block"?"none":"block";
}

async function placeOrder(){

if(!cart.length){
alert("Cart empty hai bhai 😅");
return;
}

const tableNumber=
new URLSearchParams(location.search).get("table")||"5";

let total=0;
cart.forEach(x=>total+=x.price*x.quantity);

const orderItems=cart.map(x=>({
id:x.id,
name:x.name,
price:x.price,
quantity:x.quantity
}));

setStatus("🔄 Placing order...");

try{

const {data,error}=await db
.from("orders")
.insert([{
table_number:tableNumber,
items:orderItems,
total_amount:total,
status:"pending",
payment_status:"pending"
}])
.select();

if(error)throw error;

console.log("ORDER SAVED:",data);

alert("✅ Order placed successfully! 🍽️");

cart=[];
updateCart();

document.getElementById("cartItems").style.display="none";

setStatus("✅ Order placed successfully!");

}catch(e){

console.error("ORDER ERROR:",e);

alert("❌ Order place nahi hua:\n"+e.message);

setStatus("❌ Order failed");
}
}

document.getElementById("searchInput").addEventListener("input",searchFood);
document.getElementById("cartButton").addEventListener("click",toggleCart);

loadTableNumber();
updateCart();
loadMenu();
</script>

</body>
</html>
