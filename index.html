<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Restaurant</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f6f6f6;
            color: #222;
            padding-bottom: 90px;
        }

        .header {
            background: #111;
            color: white;
            text-align: center;
            padding: 22px 15px;
        }

        .restaurant-name {
            font-size: 26px;
            font-weight: bold;
        }

        .table-number {
            margin-top: 6px;
            color: #ccc;
            font-size: 14px;
        }

        .container {
            padding: 15px;
        }

        .search {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            margin-bottom: 16px;
        }

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 5px;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category {
            white-space: nowrap;
            padding: 10px 17px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
        }

        .category.active {
            background: #111;
            color: white;
            border-color: #111;
        }

        .food-card {
            background: white;
            border-radius: 15px;
            margin-bottom: 16px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .food-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
        }

        .food-content {
            padding: 15px;
        }

        .food-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .food-name {
            font-size: 19px;
            font-weight: bold;
        }

        .food-description {
            color: #777;
            font-size: 14px;
            line-height: 1.4;
            margin-top: 7px;
        }

        .food-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
        }

        .price {
            font-size: 19px;
            font-weight: bold;
        }

        .add-btn {
            background: #111;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 9px;
            font-size: 14px;
            cursor: pointer;
        }

        .cart {
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background: #111;
            color: white;
            padding: 16px;
            border-radius: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.25);
            z-index: 1000;
        }

        .cart-items {
            display: none;
            position: fixed;
            bottom: 82px;
            left: 15px;
            right: 15px;
            background: white;
            border-radius: 15px;
            padding: 18px;
            max-height: 60vh;
            overflow-y: auto;
            box-shadow: 0 0 25px rgba(0,0,0,0.25);
            z-index: 999;
        }

        .cart-items h2 {
            margin-bottom: 15px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item-name {
            font-weight: bold;
        }

        .cart-item-price {
            color: #666;
            font-size: 13px;
            margin-top: 4px;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .quantity button {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 7px;
            background: #111;
            color: white;
            font-size: 18px;
        }

        .empty-cart {
            text-align: center;
            color: #777;
            padding: 20px 0;
        }

        .no-result {
            text-align: center;
            color: #777;
            padding: 30px 10px;
            display: none;
        }

        .loading {
            text-align: center;
            color: #777;
            padding: 40px 10px;
        }

        .debug-box {
            background: #fff3cd;
            color: #664d03;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            line-height: 1.5;
        }

        .error-box {
            background: #f8d7da;
            color: #842029;
            padding: 15px;
            border-radius: 10px;
            line-height: 1.5;
        }

    </style>

</head>


<body>


    <div class="header">

        <div class="restaurant-name">
            🍽️ My Restaurant
        </div>

        <div
            class="table-number"
            id="tableNumber"
        >
            Table No. 5
        </div>

    </div>


    <div class="container">


        <div
            class="debug-box"
            id="debugStatus"
        >
            🔄 Starting website...
        </div>


        <input
            type="text"
            class="search"
            id="searchInput"
            placeholder="🔍 Search food..."
        >


        <div
            class="categories"
            id="categories"
        >

            <div class="category active">
                All
            </div>

        </div>


        <div id="foodList">

            <div class="loading">
                Loading menu... 🍽️
            </div>

        </div>


        <div
            class="no-result"
            id="noResult"
        >
            No food found 😕
        </div>

    </div>


    <div
        class="cart-items"
        id="cartItems"
    >

        <h2>🛒 Your Cart</h2>

        <div id="cartList"></div>

    </div>


    <div
        class="cart"
        id="cartButton"
    >

        <div id="cartCount">
            🛒 Cart (0)
        </div>

        <div id="cartTotal">
            ₹0
        </div>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        console.log("STEP 1: JavaScript started");


        /* =========================================
           SUPABASE
        ========================================= */

        const SUPABASE_URL =
            "https://jxjrcjmrkhknltwvzzvr.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable__Pg5UNoizrSpSpZB3fRvbARw_fNhHGjvl";


        const statusBox =
            document.getElementById(
                "debugStatus"
            );


        function setStatus(message) {

            statusBox.innerText =
                message;

        }


        /* =========================================
           CHECK SUPABASE LIBRARY
        ========================================= */

        if (
            typeof window.supabase ===
            "undefined"
        ) {

            setStatus(
                "❌ Supabase library load nahi hui."
            );

            console.error(
                "Supabase library missing"
            );

        }

        else {

            console.log(
                "STEP 2: Supabase library loaded"
            );

            setStatus(
                "✅ Supabase library loaded"
            );

        }


        /* =========================================
           CREATE SUPABASE CLIENT
        ========================================= */

        let db = null;


        if (
            typeof window.supabase !==
            "undefined"
        ) {

            db =
                window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_KEY
                );

            console.log(
                "STEP 3: Supabase client created"
            );

        }


        /* =========================================
           VARIABLES
        ========================================= */

        let menuItems = [];

        let cart = [];

        let selectedCategory = "All";


        /* =========================================
           TABLE NUMBER
        ========================================= */

        function loadTableNumber() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const table =
                params.get("table");


            if (table) {

                document
                    .getElementById(
                        "tableNumber"
                    )
                    .innerText =
                    "Table No. " +
                    table;

            }

        }


        /* =========================================
           LOAD MENU
        ========================================= */

        async function loadMenu() {


            console.log(
                "STEP 4: loadMenu started"
            );


            setStatus(
                "🔄 Connecting to menu database..."
            );


            if (!db) {

                setStatus(
                    "❌ Supabase connection create nahi hua."
                );

                return;

            }


            try {


                const response =
                    await db
                    .from("menu_items")
                    .select("*")
                    .order(
                        "id",
                        {
                            ascending: true
                        }
                    );


                console.log(
                    "STEP 5: Supabase response",
                    response
                );


                if (
                    response.error
                ) {

                    console.error(
                        "SUPABASE ERROR:",
                        response.error
                    );


                    setStatus(
                        "❌ Database error: " +
                        response.error.message
                    );


                    document
                        .getElementById(
                            "foodList"
                        )
                        .innerHTML = `

                            <div class="error-box">

                                ❌ Menu load nahi hua.

                                <br><br>

                                ${response.error.message}

                            </div>

                        `;


                    return;

                }


                const data =
                    response.data || [];


                console.log(
                    "STEP 6: Menu data",
                    data
                );


                if (
                    data.length === 0
                ) {

                    setStatus(
                        "⚠️ Database connected hai, lekin menu_items table empty hai."
                    );


                    displayMenu([]);

                    return;

                }


                menuItems =
                    data.map(
                        item => ({

                            id:
                                item.id,

                            name:
                                item.name,

                            price:
                                Number(
                                    item.price
                                ),

                            category:
                                item.category ||
                                "Other",

                            description:
                                item.description ||
                                "",

                            image:
                                item.image_url ||
                                "https://via.placeholder.com/800x500?text=Food"

                        })
                    );


                console.log(
                    "STEP 7: Converted menu",
                    menuItems
                );


                createCategories();

                displayMenu(
                    menuItems
                );


                setStatus(
                    "✅ Menu loaded successfully — " +
                    menuItems.length +
                    " item(s)"
                );

            }

            catch (error) {

                console.error(
                    "CATCH ERROR:",
                    error
                );


                setStatus(
                    "❌ Error: " +
                    error.message
                );


                document
                    .getElementById(
                        "foodList"
                    )
                    .innerHTML = `

                        <div class="error-box">

                            ❌ Something went wrong.

                            <br><br>

                            ${error.message}

                        </div>

                    `;

            }

        }


        /* =========================================
           CREATE CATEGORIES
        ========================================= */

        function createCategories() {


            const box =
                document.getElementById(
                    "categories"
                );


            box.innerHTML = "";


            const allButton =
                document.createElement(
                    "div"
                );


            allButton.className =
                "category active";


            allButton.innerText =
                "All";


            allButton.onclick =
                function() {

                    filterCategory(
                        "All",
                        this
                    );

                };


            box.appendChild(
                allButton
            );


            const categories =
                [
                    ...new Set(
                        menuItems.map(
                            item =>
                                item.category
                        )
                    )
                ];


            categories.forEach(
                category => {


                    const button =
                        document.createElement(
                            "div"
                        );


                    button.className =
                        "category";


                    button.innerText =
                        category;


                    button.onclick =
                        function() {

                            filterCategory(
                                category,
                                this
                            );

                        };


                    box.appendChild(
                        button
                    );

                }
            );

        }


        /* =========================================
           DISPLAY MENU
        ========================================= */

        function displayMenu(
            items
        ) {


            const foodList =
                document.getElementById(
                    "foodList"
                );


            const noResult =
                document.getElementById(
                    "noResult"
                );


            foodList.innerHTML = "";


            if (
                !items ||
                items.length === 0
            ) {

                noResult.style.display =
                    "block";

                return;

            }


            noResult.style.display =
                "none";


            items.forEach(
                item => {


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "food-card";


                    card.innerHTML = `

                        <img
                            src="${item.image}"
                            class="food-image"
                            alt="${item.name}"
                            onerror="this.src='https://via.placeholder.com/800x500?text=Food'"
                        >

                        <div class="food-content">

                            <div class="food-title-row">

                                <div class="food-name">
                                    ${item.name}
                                </div>

                            </div>

                            <div class="food-description">
                                ${item.description}
                            </div>

                            <div class="food-bottom">

                                <div class="price">
                                    ₹${item.price}
                                </div>

                                <button
                                    class="add-btn"
                                    onclick="addToCart(${item.id})"
                                >
                                    + Add
                                </button>

                            </div>

                        </div>

                    `;


                    foodList.appendChild(
                        card
                    );

                }
            );

        }


        /* =========================================
           SEARCH
        ========================================= */

        function searchFood() {


            const text =
                document
                .getElementById(
                    "searchInput"
                )
                .value
                .toLowerCase()
                .trim();


            let filtered =
                menuItems.filter(
                    item =>
                        item.name
                        .toLowerCase()
                        .includes(text)
                );


            if (
                selectedCategory !==
                "All"
            ) {

                filtered =
                    filtered.filter(
                        item =>
                            item.category ===
                            selectedCategory
                    );

            }


            displayMenu(
                filtered
            );

        }


        /* =========================================
           CATEGORY
        ========================================= */

        function filterCategory(
            category,
            button
        ) {


            selectedCategory =
                category;


            document
                .querySelectorAll(
                    ".category"
                )
                .forEach(
                    btn =>
                        btn.classList.remove(
                            "active"
                        )
                );


            button.classList.add(
                "active
