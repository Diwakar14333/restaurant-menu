<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>My Restaurant</title>

<style>

/* =========================================
   RESET
========================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f5f7;
    color:#222;
    padding-bottom:95px;
}

button,
input{
    font:inherit;
}


/* =========================================
   HEADER
========================================= */

.header{
    background:linear-gradient(135deg,#111,#2d2d2d);
    color:#fff;
    padding:22px 16px 18px;
    box-shadow:0 5px 20px rgba(0,0,0,.16);
}

.header-inner{
    max-width:1000px;
    margin:auto;
    text-align:center;
}

.restaurant-name{
    font-size:28px;
    font-weight:800;
}

.table-badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:9px;
    background:#ffffff14;
    border:1px solid #ffffff20;
    padding:8px 14px;
    border-radius:30px;
    font-size:13px;
    color:#ddd;
}

.header-actions{
    display:flex;
    justify-content:center;
    margin-top:14px;
}

.header-btn{
    border:0;
    background:#fff;
    color:#111;
    padding:10px 15px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
}


/* =========================================
   MAIN
========================================= */

.container{
    max-width:1000px;
    margin:auto;
    padding:17px;
}

.status{
    text-align:center;
    font-size:12px;
    color:#777;
    margin-bottom:12px;
}

.search{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:14px;
    font-size:15px;
    background:#fff;
    outline:none;
}

.search:focus{
    border-color:#111;
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:13px 0 17px;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    white-space:nowrap;
    padding:9px 15px;
    background:#fff;
    border:1px solid #ddd;
    border-radius:22px;
    font-size:13px;
    cursor:pointer;
}

.category.active{
    background:#111;
    color:#fff;
    border-color:#111;
}


/* =========================================
   FOOD CARD
========================================= */

.food-card{
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    margin-bottom:16px;
    box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.food-image{
    width:100%;
    height:200px;
    object-fit:cover;
    display:block;
    background:#eee;
}

.food-content{
    padding:16px;
}

.food-name{
    font-size:19px;
    font-weight:800;
}

.food-description{
    font-size:13px;
    color:#777;
    line-height:1.45;
    margin-top:7px;
    min-height:37px;
}

.food-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:15px;
}

.food-price{
    font-size:19px;
    font-weight:800;
}

.add-btn{
    border:0;
    background:#111;
    color:#fff;
    padding:10px 17px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
}


/* =========================================
   CART BAR
========================================= */

.cart-bar{
    position:fixed;
    left:15px;
    right:15px;
    bottom:15px;
    z-index:1000;
    background:#111;
    color:#fff;
    padding:15px 17px;
    border-radius:16px;
    display:none;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 8px 30px rgba(0,0,0,.28);
    cursor:pointer;
    transition:.2s;
}

.cart-bar:hover{
    transform:translateY(-2px);
}

.cart-count{
    font-weight:800;
}

.cart-total{
    font-weight:800;
}


/* =========================================
   DRAWER OVERLAY
========================================= */

.drawer-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.52);
    backdrop-filter:blur(4px);
    opacity:0;
    visibility:hidden;
    transition:.25s;
    z-index:2000;
}

.drawer-overlay.open{
    opacity:1;
    visibility:visible;
}


/* =========================================
   DRAWER
========================================= */

.drawer{
    position:fixed;
    top:0;
    right:0;
    width:min(540px,95vw);
    height:100vh;
    background:#f4f5f7;
    transform:translateX(100%);
    transition:transform .30s cubic-bezier(.22,.61,.36,1);
    z-index:2001;
    display:flex;
    flex-direction:column;
    box-shadow:-15px 0 40px rgba(0,0,0,.24);
}

.drawer.open{
    transform:translateX(0);
}

.drawer-head{
    background:linear-gradient(135deg,#111,#292929);
    color:#fff;
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.drawer-title{
    font-size:20px;
    font-weight:800;
}

.drawer-subtitle{
    font-size:11px;
    color:#aaa;
    margin-top:4px;
}

.close-drawer{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#fff;
    color:#111;
    font-size:22px;
    cursor:pointer;
}

.drawer-body{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.drawer-footer{
    background:#fff;
    padding:16px;
    border-top:1px solid #eee;
}


/* =========================================
   CART ITEMS
========================================= */

.cart-item{
    background:#fff;
    border-radius:14px;
    padding:14px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.cart-item-name{
    font-weight:800;
}

.cart-item-price{
    font-size:12px;
    color:#777;
    margin-top:5px;
}

.quantity{
    display:flex;
    align-items:center;
    gap:8px;
}

.quantity button{
    width:31px;
    height:31px;
    border:0;
    border-radius:8px;
    background:#111;
    color:#fff;
    cursor:pointer;
}

.quantity span{
    min-width:18px;
    text-align:center;
    font-weight:700;
}


/* =========================================
   CART FOOTER
========================================= */

.total-row{
    display:flex;
    justify-content:space-between;
    font-size:19px;
    font-weight:800;
}

.place-btn{
    width:100%;
    border:0;
    background:#198754;
    color:#fff;
    padding:14px;
    border-radius:11px;
    margin-top:12px;
    font-weight:800;
    cursor:pointer;
}

.place-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* =========================================
   MY ORDERS
========================================= */

.bill-summary{
    background:linear-gradient(135deg,#111,#292929);
    color:#fff;
    padding:16px;
    border-radius:15px;
    margin-bottom:13px;
}

.bill-small{
    font-size:10px;
    color:#aaa;
}

.bill-main{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:5px;
}

.bill-main strong{
    font-size:24px;
}

.order-card{
    background:#fff;
    border-radius:14px;
    padding:15px;
    margin-bottom:11px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.order-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.order-id{
    font-weight:800;
    font-size:14px;
}

.order-status{
    font-size:11px;
    color:#777;
    margin-top:4px;
}

.source-badge{
    display:inline-block;
    padding:6px 9px;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
    white-space:nowrap;
}

.source-customer{
    background:#d1e7dd;
    color:#0f5132;
}

.source-waiter{
    background:#cff4fc;
    color:#055160;
}

.order-items{
    border-top:1px solid #eee;
    border-bottom:1px solid #eee;
    padding:9px 0;
    margin:10px 0;
}

.order-line{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:13px;
    padding:4px 0;
}

.order-total{
    display:flex;
    justify-content:space-between;
    font-weight:800;
}

.order-time{
    font-size:10px;
    color:#888;
    margin-top:8px;
}


/* =========================================
   EDIT WINDOW
========================================= */

.edit-window{
    margin-top:11px;
    padding:11px;
    border-radius:11px;
    font-size:11px;
}

.edit-window.active{
    background:linear-gradient(135deg,#fff8e1,#fff3cd);
    color:#856404;
}

.edit-window.locked{
    background:#f1f1f1;
    color:#777;
}

.order-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.order-edit-btn,
.order-cancel-btn{
    flex:1;
    border:0;
    padding:11px;
    border-radius:9px;
    font-weight:700;
    cursor:pointer;
}

.order-edit-btn{
    background:#ffc107;
    color:#111;
}

.order-cancel-btn{
    background:#dc3545;
    color:#fff;
}


/* =========================================
   EDIT DRAWER
========================================= */

.edit-item{
    background:#fff;
    border-radius:14px;
    padding:13px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.edit-item-name{
    font-weight:800;
}

.edit-item-price{
    font-size:12px;
    color:#777;
    margin-top:5px;
}

.edit-quantity{
    display:flex;
    align-items:center;
    gap:8px;
}

.edit-quantity button{
    width:31px;
    height:31px;
    border:0;
    border-radius:8px;
    background:#111;
    color:#fff;
    cursor:pointer;
}

.save-edit-btn{
    width:100%;
    border:0;
    background:#198754;
    color:#fff;
    padding:14px;
    border-radius:11px;
    margin-top:12px;
    font-weight:800;
    cursor:pointer;
}

.save-edit-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* =========================================
   EMPTY / ERROR
========================================= */

.empty,
.loading{
    padding:35px 10px;
    text-align:center;
    color:#777;
}

.error-box{
    background:#f8d7da;
    color:#842029;
    padding:14px;
    border-radius:10px;
    line-height:1.5;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .drawer{
        width:100vw;
    }

    .food-image{
        height:190px;
    }

    .order-actions{
        flex-direction:column;
    }

}

</style>

</head>


<body>


<!-- ======================================
     HEADER
======================================= -->

<div class="header">

<div class="header-inner">

<div class="restaurant-name">
🍽️ My Restaurant
</div>

<div class="table-badge">
🪑

Table No. 5
</span>
</div>

class="header-btn"
onclick="openOrdersDrawer()"
>
📋 My Orders

</div>

</div>


<!-- ======================================
     MAIN
======================================= -->

<div class="container">

<div
id="statusBox"
class="status"
>
🔄 Starting website...

id="searchInput"
class="search"
placeholder="🔍 Search food..."
>

class="categories"
></div>

<!-- ======================================

>

>

>
×

<div class="bill-small">
CURRENT TABLE BILL
</div>

<span id="orderCountText">
0 active orders

<div

>

You have 5 minutes to edit
</div>

</div>

onclick="closeEditOrderDrawer()"
>
×

id="editOrderBody"
class="drawer-body"
></div>

<span>
New Total
</span>

<span id="editOrderTotal">
₹0
</span>

</div>


<button
id="saveEditedOrderButton"
class="save-edit-btn"
onclick="saveEditedOrder()"
>
💾 Save Changes
</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://jxjrcjmrkhknltwvzzvr.supabase.co";

const SUPABASE_KEY =
"sb_publishable__Pg5UNoizrSpZB3fRvbARw_fNhHGjvl";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
   ELEMENTS
========================================= */

const tableNumberEl =
document.getElementById(
"tableNumber"
);

const statusBox =
document.getElementById(
"statusBox"
);

const searchInput =
document.getElementById(
"searchInput"
);

const categoriesBox =
document.getElementById(
"categories"
);

const foodList =
document.getElementById(
"foodList"
);

const cartBar =
document.getElementById(
"cartBar"
);

const cartCount =
document.getElementById(
"cartCount"
);

const cartTotal =
document.getElementById(
"cartTotal"
);

const drawerOverlay =
document.getElementById(
"drawerOverlay"
);

const cartDrawer =
document.getElementById(
"cartDrawer"
);

const cartList =
document.getElementById(
"cartList"
);

const drawerCartTotal =
document.getElementById(
"drawerCartTotal"
);

const placeOrderButton =
document.getElementById(
"placeOrderButton"
);

const ordersDrawer =
document.getElementById(
"ordersDrawer"
);

const ordersSubtitle =
document.getElementById(
"ordersSubtitle"
);

const orderCountText =
document.getElementById(
"orderCountText"
);

const currentBill =
document.getElementById(
"currentBill"
);

const myOrdersList =
document.getElementById(
"myOrdersList"
);

const editOrderDrawer =
document.getElementById(
"editOrderDrawer"
);

const editOrderSubtitle =
document.getElementById(
"editOrderSubtitle"
);

const editOrderBody =
document.getElementById(
"editOrderBody"
);

const editOrderTotal =
document.getElementById(
"editOrderTotal"
);

const saveEditedOrderButton =
document.getElementById(
"saveEditedOrderButton"
);


/* =========================================
   STATE
========================================= */

let currentTable =
new URLSearchParams(
window.location.search
).get("table") || "5";

let sessionId = null;

let menuItems = [];

let cart = [];

let selectedCategory = "All";

let ordersRefreshTimer = null;

let countdownTimer = null;

let editingOrder = null;

let editingItems = [];


/* =========================================
   TABLE
========================================= */

tableNumberEl.innerText =
"Table No. "+
currentTable;


/* =========================================
   BASIC HELPERS
========================================= */

function setStatus(
text
){

statusBox.innerText =
text;

}


function money(
value
){

return "₹"+
Number(
value || 0
);

}


/* =========================================
   GET TABLE SESSION
========================================= */

async function getCurrentSession(){

const {
data,
error
} =
await db.rpc(
"get_or_create_table_session",
{
p_table_number:
String(currentTable)
}
);

if(error){

throw error;

}

sessionId =
data.id;

return data;

}


/* =========================================
   LOAD MENU
========================================= */

async function loadMenu(){

setStatus(
"🔄 Loading menu..."
);

try{

await getCurrentSession();


const {
data,
error
} =
await db
.from("menu_items")
.select("*")
.order(
"id",
{
ascending:true
}
);


if(error){

throw error;

}


menuItems =
(data || []).map(
item=>({

id:item.id,

name:item.name,

price:Number(
item.price
),

category:
item.category ||
"Other",

description:
item.description ||
"",

image:
item.image_url ||
"https://via.placeholder.com/800x500?text=Food"

})
);


createCategories();

renderMenu(
menuItems
);

setStatus(
"✅ Menu ready"
);


}catch(error){

console.error(
error
);

setStatus(
"❌ Database error"
);

foodList.innerHTML =
`
<div class="error-box">

❌ Menu load nahi hua.

<br><br>

${error.message}

</div>
`;

}

}


/* =========================================
   CATEGORIES
========================================= */

function createCategories(){

categoriesBox.innerHTML =
"";


const allButton =
document.createElement(
"div"
);

allButton.className =
"category active";

allButton.innerText =
"All";

allButton.onclick =
function(){

filterCategory(
"All",
allButton
);

};

categoriesBox.appendChild(
allButton
);


const categoryNames =
[
    ...new Set(
        menuItems
            .map(
                item=>item.category
            )
            .filter(Boolean)
    )
];


categoryNames.forEach(
categoryName=>{

const button =
document.createElement(
"div"
);

button.className =
"category";

button.innerText =
categoryName;

button.onclick =
function(){

filterCategory(
categoryName,
button
);

};

categoriesBox.appendChild(
button
);

});

}


function filterCategory(
categoryName,
button
){

selectedCategory =
categoryName;


document
.querySelectorAll(
".category"
)
.forEach(
buttonItem=>{
buttonItem.classList.remove(
"active"
);
});


button.classList.add(
"active"
);


searchFood();

}


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
"input",
searchFood
);


function searchFood(){

const text =
searchInput.value
.toLowerCase()
.trim();


let filtered =
menuItems.filter(
item=>

item.name
.toLowerCase()
.includes(text)

);


if(
selectedCategory !==
"All"
){

filtered =
filtered.filter(
item=>
item.category ===
selectedCategory
);

}


renderMenu(
filtered
);

}


/* =========================================
   RENDER MENU
========================================= */

function renderMenu(
items
){

foodList.innerHTML =
"";


if(!items.length){

foodList.innerHTML =
`
<div class="empty">
😕 No food found.
</div>
`;

return;

}


items.forEach(
item=>{

foodList.innerHTML += `

<div class="food-card">

<img
class="food-image"
src="${item.image}"
alt="${item.name}"
onerror="
this.src=
'https://via.placeholder.com/800x500?text=Food'
"
>

<div class="food-content">

<div class="food-name">
${item.name}
</div>

<div class="food-description">
${item.description}
</div>

<div class="food-bottom">

<div class="food-price">
₹${item.price}
</div>

<button
class="add-btn"
onclick="
addToCart(${item.id})
"
>
+ Add
</button>

</div>

</div>

</div>

`;

});

}


/* =========================================
   ADD TO CART
========================================= */

function addToCart(
itemId
){

const item =
menuItems.find(
food =>
food.id ===
itemId
);


if(!item){

return;

}


const existing =
cart.find(
food =>
food.id ===
itemId
);


if(existing){

existing.quantity++;

}else{

cart.push({

id:item.id,

name:item.name,

price:item.price,

quantity:1

});

}


renderCart();

}


/* =========================================
   CART QUANTITY
========================================= */

function changeCartQuantity(
index,
change
){

if(!cart[index]){

return;

}


cart[index].quantity +=
change;


if(
cart[index].quantity <=
0
){

cart.splice(
index,
1
);

}


renderCart();

}


/* =========================================
   CART TOTALS
========================================= */

function getCartCount(){

return cart.reduce(
(
sum,
item
)=>
sum+
item.quantity,
0
);

}


function getCartTotal(){

return cart.reduce(
(
sum,
item
)=>
sum+
(
item.price*
item.quantity
),
0
);

}


/* =========================================
   RENDER CART
========================================= */

function renderCart(){

const count =
getCartCount();

const total =
getCartTotal();


cartCount.innerText =
"🛒 Cart ("+
count+
")";


cartTotal.innerText =
money(total);


drawerCartTotal.innerText =
money(total);


cartBar.style.display =
count > 0
?
"flex"
:
"none";


if(!cart.length){

cartList.innerHTML =
`
<div class="empty">
🛒 Cart empty hai.
</div>
`;

return;

}


cartList.innerHTML =
"";


cart.forEach(
(
item,
index
)=>{

const itemTotal =
item.price*
item.quantity;


cartList.innerHTML += `

<div class="cart-item">

<div>

<div class="cart-item-name">
${item.name}
</div>

<div class="cart-item-price">

₹${item.price}
×
${item.quantity}
=
₹${itemTotal}

</div>

</div>


<div class="quantity">

<button
onclick="
changeCartQuantity(
${index},
-1
)
"
>
−
</button>

<span>
${item.quantity}
</span>

<button
onclick="
changeCartQuantity(
${index},
1
)
"
>
+
</button>

</div>

</div>

`;

});

}


/* =========================================
   CART DRAWER
========================================= */

function openCartDrawer(){

closeOrdersDrawer();

closeEditOrderDrawer();


cartDrawer.classList.add(
"open"
);

drawerOverlay.classList.add(
"open"
);

}


function closeCartDrawer(){

cartDrawer.classList.remove(
"open"
);


if(
!ordersDrawer.classList.contains(
"open"
) &&
!editOrderDrawer.classList.contains(
"open"
)
){

drawerOverlay.classList.remove(
"open"
);

}

}


/* =========================================
   PLACE CUSTOMER ORDER
========================================= */

async function placeCustomerOrder(){

if(!cart.length){

alert(
"Cart empty hai."
);

return;

}


placeOrderButton.disabled =
true;

placeOrderButton.innerText =
"⏳ Placing Order...";


try{

if(!sessionId){

await getCurrentSession();

}


const items =
cart.map(
item=>({

id:item.id,

name:item.name,

price:item.price,

quantity:item.quantity

})
);


const total =
getCartTotal();


const {
data,
error
} =
await db.rpc(
"create_customer_order",
{
p_table_number:
String(currentTable),

p_items:
items,

p_total_amount:
total,

p_session_id:
sessionId
}
);


if(error){

throw error;

}


cart = [];

renderCart();

closeCartDrawer();


alert(
"✅ Order #"+
data.id+
" placed successfully! 🍽️"
);


setStatus(
"✅ Order placed"
);


}catch(error){

console.error(
error
);

alert(
"❌ Order place nahi hua:\n"+
error.message
);

}finally{

placeOrderButton.disabled =
false;

placeOrderButton.innerText =
"🍽️ Place Order";

}

}


/* =========================================
   MY ORDERS
========================================= */

async function loadMyOrders(){

myOrdersList.innerHTML =
`
<div class="loading">
Loading orders...
</div>
`;


try{

if(!sessionId){

await getCurrentSession();

}


const {
data,
error
} =
await db
.from("orders")
.select("*")
.eq(
"session_id",
sessionId
)
.neq(
"payment_status",
"paid"
)
.neq(
"status",
"cancelled"
)
.order(
"created_at",
{
ascending:false
}
);


if(error){

throw error;

}


const orders =
data || [];


const total =
orders.reduce(
(
sum,
order
)=>
sum+
Number(
order.total_amount ||
0
),
0
);


currentBill.innerText =
money(total);


orderCountText.innerText =
orders.length+
" active order"+
(
orders.length === 1
?
""
:
"s"
);


ordersSubtitle.innerText =
"Table "+
currentTable+
" • Current session";


if(!orders.length){

myOrdersList.innerHTML =
`
<div class="empty">

✅ No active orders.

<br><br>

Menu se food add karke order place karo.

</div>
`;

return;

}


myOrdersList.innerHTML =
"";


orders.forEach(
order=>{
renderOrderCard(
order
);
});

startCountdownTimer();


}catch(error){

console.error(
error
);

myOrdersList.innerHTML =
`
<div class="error-box">

❌ My Orders load nahi hua.

<br><br>

${error.message}

</div>
`;

}

}


/* =========================================
   ORDER CARD
========================================= */

function renderOrderCard(
order
){

let items =
order.items;


if(
typeof items ===
"string"
){

try{

items =
JSON.parse(
items
);

}catch(error){

items = [];

}

}


let lines =
"";


if(
Array.isArray(items)
){

items.forEach(
item=>{

lines += `

<div class="order-line">

<span>

${item.name}
×
${item.quantity || 1}

</span>

<span>

${money(
Number(item.price || 0)*
Number(item.quantity || 1)
)}

</span>

</div>

`;

});

}


const isWaiter =
order.order_source ===
"waiter";


const sourceClass =
isWaiter
?
"source-waiter"
:
"source-customer";


const sourceText =
isWaiter
?
"🔵 WAITER • "+
(
order.waiter_name ||
"Waiter"
)
:
"🟢 CUSTOMER";


const card =
document.createElement(
"div"
);

card.className =
"order-card";

card.id =
"order-card-"+order.id;


card.innerHTML = `

<div class="order-top">

<div>

<div class="order-id">

Order #${order.id}

</div>

<div class="order-status">

${String(
order.status ||
"pending"
).toUpperCase()}

•

Payment:
${String(
order.payment_status ||
"pending"
).toUpperCase()}

</div>

</div>


<div
class="source-badge ${sourceClass}"
>

${sourceText}

</div>

</div>


<div class="order-items">

${lines}

</div>


<div class="order-total">

<span>
Total
</span>

<span>
${money(
order.total_amount
)}
</span>

</div>


<div class="order-time">

🕒
${
order.created_at
?
new Date(
order.created_at
).toLocaleString(
"en-IN"
)
:
""
}

</div>


<div
class="edit-window"
id="edit-window-${order.id}"
>
Checking edit window...
</div>


<div
id="order-actions-${order.id}"
>
</div>

`;


myOrdersList.appendChild(
card
);


updateOrderControls(
order
);

}


/* =========================================
   UPDATE EDIT / CANCEL CONTROLS
========================================= */

function updateOrderControls(
order
){

const windowBox =
document.getElementById(
"edit-window-"+order.id
);

const actionsBox =
document.getElementById(
"order-actions-"+order.id
);


if(!windowBox || !actionsBox){

return;

}


const created =
new Date(
order.created_at
);


const ageSeconds =
Math.floor(
(
Date.now()-
created.getTime()
)/
1000
);


const remaining =
Math.max(
0,
300-ageSeconds
);


const canEdit =
order.order_source !==
"waiter" &&

String(
order.status ||
"pending"
).toLowerCase() ===
"pending" &&

String(
order.payment_status ||
"pending"
).toLowerCase() !==
"paid" &&

remaining > 0;


if(canEdit){

const minutes =
Math.floor(
remaining/60
);

const seconds =
remaining%60;


windowBox.className =
"edit-window active";


windowBox.innerText =
"⏱️ Edit / Cancel available for "+
minutes+
":"+
String(
seconds
).padStart(
2,
"0"
);


actionsBox.innerHTML = `

<div class="order-actions">

<button
class="order-edit-btn"
onclick="
openEditOrderDrawer(
${order.id}
)
"
>
✏️ Edit
</button>


<button
class="order-cancel-btn"
onclick="
cancelCustomerOrder(
${order.id}
)
"
>
❌ Cancel
</button>

</div>

`;

}else{

windowBox.className =
"edit-window locked";


windowBox.innerText =
order.order_source ===
"waiter"
?
"🔒 Staff order — customer edit unavailable"
:
"🔒 Edit / Cancel window closed";


actionsBox.innerHTML =
"";

}

}


/* =========================================
   COUNTDOWN TIMER
========================================= */

function startCountdownTimer(){

clearInterval(
countdownTimer
);

countdownTimer =
setInterval(
updateAllOrderTimers,
1000
);

}


function updateAllOrderTimers(){

const cards =
myOrdersList.querySelectorAll(
".order-card"
);


cards.forEach(
card=>{

const id =
card.id.replace(
"order-card-",
""
);


refreshOneOrderControls(
id
);

});

}


async function refreshOneOrderControls(
orderId
){

const card =
document.getElementById(
"order-card-"+orderId
);


if(!card){

return;

}


const {
data,
error
} =
await db
.from("orders")
.select(
"order_source,status,payment_status,created_at,id"
)
.eq(
"id",
orderId
)
.single();


if(error || !data){

return;

}


updateOrderControls(
data
);

}


/* =========================================
   OPEN MY ORDERS
========================================= */

async function openOrdersDrawer(){

closeEditOrderDrawer();

"open"
);

drawerOverlay.classList.add(

);


if(
!cartDrawer.classList.contains(

) &&

"open"
)
){

drawerOverlay.classList.remove(
"open"
);

}


clearInterval(
ordersRefreshTimer
);

clearInterval(
countdownTimer
);

}


/* =========================================
   EDIT ORDER
========================================= */

async function openEditOrderDrawer(
orderId
){

try{

const {
data,
error
} =
await db
.from("orders")
.select("*")
.eq(
"id",
orderId
)
.single();


if(error){

throw error;

}


if(
data.order_source ===
"waiter"
){

alert(
"Ye waiter order hai. Customer isse edit nahi kar sakta."
);

return;

}


if(
String(
data.status ||
"pending"
).toLowerCase() !==
"pending"
){

alert(
"Ye order ab edit nahi ho sakta."
);

return;

}


if(
String(
data.payment_status ||
"pending"
).toLowerCase() ===
"paid"
){

alert(
"Paid order edit nahi ho sakta."
);

return;

}


const ageSeconds =
Math.floor(
(
Date.now()-
new Date(
data.created_at
).getTime()
)/
1000
);


if(
ageSeconds >= 300
){

alert(
"5-minute edit window khatam ho gaya."
);

await loadMyOrders();

return;

}


editingOrder =
data;


let items =
data.items;


if(
typeof items ===
"string"
){

items =
JSON.parse(
items
);

}


editingItems =
(
Array.isArray(items)
?
items
:
[]
).map(
item=>({

id:item.id,

name:item.name,

price:Number(
item.price
),

quantity:Number(
item.quantity ||
1
)

})
);


editOrderSubtitle.innerText =
"Order #"+
data.id+
" • Edit window active";


renderEditOrder();


closeOrdersDrawer();


editOrderDrawer.classList.add(
"open"
);

drawerOverlay.classList.add(
"open"
);


}catch(error){

console.error(
error
);

alert(
"❌ "+error.message
);

}

}


/* =========================================
   RENDER EDIT ORDER
========================================= */

function renderEditOrder(){

editOrderBody.innerHTML =
"";


let total =
0;


if(!editingItems.length){

editOrderBody.innerHTML =
`
<div class="empty">
Order empty hai.
</div>
`;

editOrderTotal.innerText =
"₹0";

return;

}


editingItems.forEach(
(
item,
index
)=>{

const itemTotal =
item.price*
item.quantity;


total +=
itemTotal;


editOrderBody.innerHTML += `

<div class="edit-item">

<div>

<div class="edit-item-name">
${item.name}
</div>

<div class="edit-item-price">

₹${item.price}
×
${item.quantity}
=
₹${itemTotal}

</div>

</div>


<div class="edit-quantity">

<button
onclick="
changeEditQuantity(
${index},
-1
)
"
>
−
</button>

<span>
${item.quantity}
</span>

<button
onclick="
changeEditQuantity(
${index},
1
)
"
>
+
</button>

</div>

</div>

`;

});


editOrderTotal.innerText =
money(total);

}


/* =========================================
   CHANGE EDIT QUANTITY
========================================= */

function changeEditQuantity(
index,
change
){

if(
!editingItems[index]
){

return;

}


editingItems[index].quantity +=
change;


if(
editingItems[index].quantity <=
0
){

editingItems.splice(
index,
1
);

}


renderEditOrder();

}


/* =========================================
   SAVE EDITED ORDER
========================================= */

async function saveEditedOrder(){

if(!editingOrder){

return;

}


const ageSeconds =
Math.floor(
(
Date.now()-
new Date(
editingOrder.created_at
).getTime()
)/
1000
);


if(
ageSeconds >= 300
){

alert(
"5-minute edit window khatam ho gaya."
);

closeEditOrderDrawer();

return;

}


if(!editingItems.length){

const yes =
confirm(
"Saare items remove ho gaye hain. Order cancel karna hai?"
);


if(yes){

await cancelCustomerOrder(
editingOrder.id
);

closeEditOrderDrawer();

}

return;

}


const items =
editingItems.map(
item=>({

id:item.id,

name:item.name,

price:item.price,

quantity:item.quantity

})
);


const total =
editingItems.reduce(
(
sum,
item
)=>
sum+
(
item.price*
item.quantity
),
0
);


saveEditedOrderButton.disabled =
true;

saveEditedOrderButton.innerText =
"⏳ Saving...";


try{

const {
error
} =
await db.rpc(
"edit_customer_order",
{
p_order_id:
editingOrder.id,

p_items:
items,

p_total_amount:
total
}
);


if(error){

throw error;

}


alert(
"✅ Order updated successfully!"
);


closeEditOrderDrawer();

editingOrder =
null;

editingItems =
[];


if(
ordersDrawer.classList.contains(
"open"
)
){

await loadMyOrders();

}


}catch(error){

console.error(
error
);

alert(
"❌ Order update nahi hua:\n"+
error.message
);

}finally{

saveEditedOrderButton.disabled =
false;

saveEditedOrderButton.innerText =
"💾 Save Changes";

}

}

   CANCEL ORDER

orderId
){

confirm(

orderId+

}

error
);

error.message
);

}

}

);

null;

   CLOSE ALL

function closeAllDrawers(){

cartDrawer.classList.remove(

/* =========================================

renderCart();

loadMenu();
