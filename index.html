<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Restaurant</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f6f6f6;
            color: #222;
            padding-bottom: 90px;
        }

        /* HEADER */

        .header {
            background: #111;
            color: white;
            text-align: center;
            padding: 22px 15px;
        }

        .restaurant-name {
            font-size: 26px;
            font-weight: bold;
        }

        .table-number {
            margin-top: 6px;
            color: #ccc;
            font-size: 14px;
        }

        /* MAIN */

        .container {
            padding: 15px;
        }

        /* SEARCH */

        .search {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            margin-bottom: 16px;
        }

        /* CATEGORIES */

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-bottom: 20px;
        }

        .category {
            white-space: nowrap;
            padding: 10px 17px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
        }

        .category.active {
            background: #111;
            color: white;
        }

        /* FOOD CARD */

        .food-card {
            background: white;
            border-radius: 15px;
            margin-bottom: 16px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .food-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
        }

        .food-content {
            padding: 15px;
        }

        .food-title-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .food-name {
            font-size: 19px;
            font-weight: bold;
        }

        .popular {
            background: #ffe7a3;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 11px;
        }

        .food-description {
            color: #777;
            font-size: 14px;
            margin-top: 7px;
        }

        .food-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
        }

        .price {
            font-size: 19px;
            font-weight: bold;
        }

        .add-btn {
            background: #111;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 9px;
            cursor: pointer;
        }

        /* CART */

        .cart {
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background: #111;
            color: white;
            padding: 16px;
            border-radius: 13px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
            z-index: 1000;
        }

        .cart-items {
            display: none;
            position: fixed;
            bottom: 82px;
            left: 15px;
            right: 15px;
            background: white;
            border-radius: 15px;
            padding: 18px;
            max-height: 60vh;
            overflow-y: auto;
            box-shadow: 0 0 25px rgba(0,0,0,0.25);
            z-index: 999;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .quantity button {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 7px;
            background: #111;
            color: white;
            font-size: 18px;
        }

        /* QR SECTION */

        .qr-section {
            background: white;
            margin: 25px 15px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .qr-section h2 {
            margin-bottom: 8px;
        }

        .qr-section p {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .table-input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .qr-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #qrBox {
            margin-top: 20px;
            display: none;
        }

        #qrImage {
            width: 220px;
            max-width: 100%;
            border: 8px solid white;
        }

        .download-button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            background: #198754;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="header">

        <div class="restaurant-name">
            🍽️ My Restaurant
        </div>

        <div
            class="table-number"
            id="tableNumber"
        >
            Table No. 5
        </div>

    </div>


    <!-- MENU -->

    <div class="container">

        <input
            type="text"
            class="search"
            id="searchInput"
            placeholder="🔍 Search food..."
            onkeyup="searchFood()"
        >


        <div class="categories">

            <div
                class="category active"
                onclick="filterCategory('All', this)"
            >
                All
            </div>

            <div
                class="category"
                onclick="filterCategory('Biryani', this)"
            >
                Biryani
            </div>

            <div
                class="category"
                onclick="filterCategory('Pizza', this)"
            >
                Pizza
            </div>

            <div
                class="category"
                onclick="filterCategory('Drinks', this)"
            >
                Drinks
            </div>

            <div
                class="category"
                onclick="filterCategory('Desserts', this)"
            >
                Desserts
            </div>

        </div>


        <div id="foodList"></div>

    </div>


    <!-- CART -->

    <div
        class="cart-items"
        id="cartItems"
    >

        <h2>🛒 Your Cart</h2>

        <div id="cartList"></div>

    </div>


    <div
        class="cart"
        onclick="toggleCart()"
    >

        <div id="cartCount">
            🛒 Cart (0)
        </div>

        <div id="cartTotal">
            ₹0
        </div>

    </div>


    <!-- QR GENERATOR -->

    <div class="qr-section">

        <h2>📱 Table QR Generator</h2>

        <p>
            Table number enter karo aur QR generate karo.
        </p>


        <input
            type="number"
            id="tableInput"
            class="table-input"
            placeholder="Example: 5"
            min="1"
        >


        <button
            class="qr-button"
            onclick="generateQR()"
        >
            Generate QR Code
        </button>


        <div id="qrBox">

            <img
                id="qrImage"
                alt="Table QR Code"
            >


            <button
                class="download-button"
                onclick="downloadQR()"
            >
                Download QR
            </button>

        </div>

    </div>


    <script>


        /* =========================
           MENU DATA
        ========================= */

        const menuItems = [

            {
                id: 1,
                name: "Chicken Biryani",
                price: 180,
                category: "Biryani",
                description: "Delicious chicken biryani with aromatic spices.",
                image: "https://images.unsplash.com/photo-1631515242808-497c3fbd3972?auto=format&fit=crop&w=800&q=85",
                popular: true
            },

            {
                id: 2,
                name: "Chicken Pizza",
                price: 220,
                category: "Pizza",
                description: "Fresh chicken pizza loaded with cheese.",
                image: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=800&q=85",
                popular: true
            },

            {
                id: 3,
                name: "Coke",
                price: 50,
                category: "Drinks",
                description: "Chilled Coca-Cola.",
                image: "https://images.unsplash.com/photo-1629203849820-fdd70d49c38e?auto=format&fit=crop&w=800&q=85",
                popular: false
            },

            {
                id: 4,
                name: "Gulab Jamun",
                price: 80,
                category: "Desserts",
                description: "Soft and delicious gulab jamun.",
                image: "https://images.unsplash.com/photo-1666190094765-9c5a8d6f5e2e?auto=format&fit=crop&w=800&q=85",
                popular: false
            }

        ];


        let cart = [];

        let selectedCategory = "All";


        /* =========================
           TABLE NUMBER FROM QR
        ========================= */

        function loadTableNumber() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const table =
                params.get("table");


            if (table) {

                document
                    .getElementById("tableNumber")
                    .innerText =
                    "Table No. " + table;

            }

        }


        /* =========================
           DISPLAY MENU
        ========================= */

        function displayMenu(items) {

            const foodList =
                document.getElementById("foodList");


            foodList.innerHTML = "";


            items.forEach(item => {

                const card =
                    document.createElement("div");


                card.className =
                    "food-card";


                card.innerHTML = `

                    <img
                        src="${item.image}"
                        class="food-image"
                        alt="${item.name}"
                    >

                    <div class="food-content">

                        <div class="food-title-row">

                            <div class="food-name">
                                ${item.name}
                            </div>

                            ${
                                item.popular
                                ?
                                '<div class="popular">⭐ Popular</div>'
                                :
                                ''
                            }

                        </div>


                        <div class="food-description">
                            ${item.description}
                        </div>


                        <div class="food-bottom">

                            <div class="price">
                                ₹${item.price}
                            </div>


                            <button
                                class="add-btn"
                                onclick="addToCart(${item.id})"
                            >
                                + Add
                            </button>

                        </div>

                    </div>

                `;


                foodList.appendChild(card);

            });

        }


        /* =========================
           CART
        ========================= */

        function addToCart(id) {

            const item =
                menuItems.find(
                    food => food.id === id
                );


            const existing =
                cart.find(
                    food => food.id === id
                );


            if (existing) {

                existing.quantity++;

            } else {

                cart.push({

                    id: item.id,
                    name: item.name,
                    price: item.price,
                    quantity: 1

                });

            }


            updateCart();

        }


        function increaseQuantity(index) {

            cart[index].quantity++;

            updateCart();

        }


        function decreaseQuantity(index) {

            cart[index].quantity--;


            if (cart[index].quantity <= 0) {

                cart.splice(index, 1);

            }


            updateCart();

        }


        function updateCart() {

            let count = 0;

            let total = 0;


            cart.forEach(item => {

                count += item.quantity;

                total +=
                    item.price *
                    item.quantity;

            });


            document
                .getElementById("cartCount")
                .innerText =
                "🛒 Cart (" + count + ")";


            document
                .getElementById("cartTotal")
                .innerText =
                "₹" + total;


            const cartList =
                document.getElementById("cartList");


            if (cart.length === 0) {

                cartList.innerHTML =
                    "<p>Your cart is empty.</p>";

                return;

            }


            cartList.innerHTML = "";


            cart.forEach(
                (item, index) => {

                    cartList.innerHTML += `

                        <div class="cart-item">

                            <div>

                                <strong>
                                    ${item.name}
                                </strong>

                                <div>
                                    ₹${item.price * item.quantity}
                                </div>

                            </div>


                            <div class="quantity">

                                <button
                                    onclick="decreaseQuantity(${index})"
                                >
                                    −
                                </button>

                                <span>
                                    ${item.quantity}
                                </span>

                                <button
                                    onclick="increaseQuantity(${index})"
                                >
                                    +
                                </button>

                            </div>

                        </div>

                    `;

                }
            );

        }


        function toggleCart() {

            const box =
                document.getElementById(
                    "cartItems"
                );


            box.style.display =
                box.style.display === "block"
                ? "none"
                : "block";

        }


        /* =========================
           SEARCH
        ========================= */

        function searchFood() {

            const text =
                document
                .getElementById("searchInput")
                .value
                .toLowerCase();


            let result =
                menuItems.filter(item =>
                    item.name
                    .toLowerCase()
                    .includes(text)
                );


            if (selectedCategory !== "All") {

                result =
                    result.filter(
                        item =>
                        item.category ===
                        selectedCategory
                    );

            }


            displayMenu(result);

        }


        /* =========================
           CATEGORY
        ========================= */

        function filterCategory(
            category,
            button
        ) {

            selectedCategory =
                category;


            document
                .querySelectorAll(".category")
                .forEach(btn =>
                    btn.classList.remove("active")
                );


            button.classList.add("active");


            searchFood();

        }


        /* =========================
           GENERATE QR
        ========================= */

        function generateQR() {

            const table =
                document
                .getElementById("tableInput")
                .value;


            if (!table) {

                alert(
                    "Pehle table number enter karo."
                );

                return;

            }


            /*
                Ye URL current page ko
                table number ke saath banata hai.

                Example:

                index.html?table=5
            */

            const currentURL =
                window.location.href
                .split("?")[0];


            const tableURL =
                currentURL +
                "?table=" +
                encodeURIComponent(table);


            /*
                Google Chart QR API
                se QR image generate hogi.
            */

            const qrURL =
                "https://quickchart.io/qr?text="
                +
                encodeURIComponent(tableURL)
                +
                "&size=500";


            document
                .getElementById("qrImage")
                .src = qrURL;


            document
                .getElementById("qrBox")
                .style.display = "block";

        }


        /* =========================
           DOWNLOAD QR
        ========================= */

        function downloadQR() {

            const image =
                document
                .getElementById("qrImage");


            const link =
                document.createElement("a");


            link.href =
                image.src;


            link.download =
                "restaurant-table-QR.png";


            link.target = "_blank";


            link.click();

        }


        /* =========================
           START WEBSITE
        ========================= */

        loadTableNumber();

        displayMenu(menuItems);

        updateCart();

    </script>

</body>

</html>
