<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f5f5;color:#222;padding:20px}
.header{background:#111;color:#fff;padding:20px;border-radius:15px;margin-bottom:20px}
.header h1{font-size:24px}
.header p{color:#bbb;margin-top:5px;font-size:14px}
.refresh{width:100%;padding:13px;background:#111;color:#fff;border:0;border-radius:10px;font-size:15px;margin-bottom:20px}
.order{background:#fff;border-radius:15px;padding:18px;margin-bottom:15px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.order-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}
.table{font-size:18px;font-weight:bold}
.status{padding:6px 10px;border-radius:7px;background:#fff3cd;color:#856404;font-size:12px;font-weight:bold}
.items{border-top:1px solid #eee;border-bottom:1px solid #eee;padding:12px 0;margin:10px 0}
.item{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:bold}
.time{color:#777;font-size:12px;margin-top:10px}
.empty{text-align:center;color:#777;padding:40px 10px}
.error{background:#f8d7da;color:#842029;padding:15px;border-radius:10px}
</style>
</head>

<body>

<div class="header">
<h1>🍽️ Restaurant Admin</h1>
<p>Live Customer Orders</p>
</div>

<button class="refresh" onclick="loadOrders()">🔄 Refresh Orders</button>

<div id="orders">
<div class="empty">Loading orders...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL="https://jxjrcjmrkhknltwvzzvr.supabase.co";

const SUPABASE_KEY="sb_publishable__Pg5UNoizrSpZB3fRvbARw_fNhHGjvl";

const db=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function loadOrders(){

const box=document.getElementById("orders");

box.innerHTML='<div class="empty">Loading orders... 🍽️</div>';

try{

const result=await db
.from("orders")
.select("*")
.order("created_at",{ascending:false});

if(result.error){

console.error(result.error);

box.innerHTML=`
<div class="error">
❌ Orders load nahi hue.
<br><br>
${result.error.message}
</div>`;

return;
}

const orders=result.data||[];

if(orders.length===0){

box.innerHTML=`
<div class="empty">
📭 Abhi koi order nahi hai.
</div>`;

return;
}

box.innerHTML="";

orders.forEach(order=>{

let itemsHTML="";

let items=order.items;

if(typeof items==="string"){

try{
items=JSON.parse(items);
}catch(e){
items=[];
}

}

if(Array.isArray(items)){

items.forEach(item=>{

const name=item.name||"Item";
const quantity=item.quantity||1;
const price=item.price||0;

itemsHTML+=`
<div class="item">
<span>${name} × ${quantity}</span>
<span>₹${price*quantity}</span>
</div>`;

});

}else{

itemsHTML=`
<div class="item">
<span>Order items</span>
<span>—</span>
</div>`;

}

const date=order.created_at
?new Date(order.created_at).toLocaleString("en-IN")
:"";

const status=order.status||"pending";

box.innerHTML+=`

<div class="order">

<div class="order-top">

<div class="table">
🪑 Table ${order.table_number||"-"}
</div>

<div class="status">
${status.toUpperCase()}
</div>

</div>

<div class="items">
${itemsHTML}
</div>

<div class="total">
<span>Total</span>
<span>₹${order.total_amount||0}</span>
</div>

<div class="time">
🕒 ${date}
</div>

</div>`;

});

}catch(error){

console.error(error);

box.innerHTML=`
<div class="error">
❌ Something went wrong.
<br><br>
${error.message}
</div>`;

}

}

loadOrders();

</script>

</body>
</html>
