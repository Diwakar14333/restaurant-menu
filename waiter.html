<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Waiter Dashboard</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
    padding-bottom:110px;
}

/* HEADER */

.header{
    background:#111;
    color:white;
    padding:18px;
    position:sticky;
    top:0;
    z-index:100;
}

.header-row{
    max-width:1000px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.header h1{
    font-size:21px;
}

.header p{
    color:#bbb;
    font-size:13px;
    margin-top:5px;
}

.logout{
    background:#fff;
    color:#111;
    border:0;
    padding:9px 13px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

/* CONTAINER */

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

/* WELCOME */

.welcome{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.welcome h2{
    font-size:22px;
}

.welcome p{
    color:#777;
    margin-top:6px;
}

/* SECTION */

.section{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.section-title{
    font-size:20px;
    margin-bottom:6px;
}

.description{
    color:#777;
    font-size:13px;
    margin-bottom:18px;
}

/* TABLES */

.tables{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.table-btn{
    background:#f7f7f7;
    border:2px solid #eee;
    border-radius:15px;
    padding:18px 10px;
    cursor:pointer;
    text-align:center;
    transition:.2s;
}

.table-btn:hover{
    transform:translateY(-2px);
}

.table-btn.active{
    background:#111;
    color:white;
    border-color:#111;
}

.table-icon{
    font-size:30px;
    margin-bottom:7px;
}

.table-name{
    font-weight:bold;
}

.table-status{
    font-size:11px;
    margin-top:5px;
    opacity:.7;
}

/* MENU */

#menuSection{
    display:none;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.menu-card{
    background:#fff;
    border:1px solid #eee;
    border-radius:16px;
    overflow:hidden;
}

.menu-image{
    width:100%;
    height:170px;
    object-fit:cover;
    display:block;
}

.menu-content{
    padding:15px;
}

.menu-name{
    font-size:17px;
    font-weight:bold;
}

.menu-category{
    color:#777;
    font-size:12px;
    margin-top:4px;
}

.menu-description{
    color:#777;
    font-size:13px;
    line-height:1.4;
    margin-top:8px;
}

.menu-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:13px;
}

.price{
    font-size:17px;
    font-weight:bold;
}

.add-btn{
    background:#111;
    color:white;
    border:0;
    border-radius:9px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:bold;
}

/* CART */

#cartSection{
    display:none;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:13px 0;
    border-bottom:1px solid #eee;
}

.cart-info{
    flex:1;
}

.cart-name{
    font-weight:bold;
}

.cart-price{
    color:#777;
    font-size:13px;
    margin-top:4px;
}

.qty{
    display:flex;
    align-items:center;
    gap:8px;
}

.qty button{
    width:30px;
    height:30px;
    border:0;
    border-radius:8px;
    background:#eee;
    cursor:pointer;
    font-weight:bold;
}

.qty span{
    min-width:20px;
    text-align:center;
    font-weight:bold;
}

.cart-total{
    display:flex;
    justify-content:space-between;
    font-size:20px;
    font-weight:bold;
    padding-top:18px;
}

.place-order{
    width:100%;
    border:0;
    background:#198754;
    color:white;
    padding:15px;
    border-radius:11px;
    margin-top:15px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.place-order:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* EMPTY */

.empty{
    text-align:center;
    color:#777;
    padding:30px 10px;
}

/* MESSAGE */

.message{
    display:none;
    padding:13px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:14px;
}

.success{
    background:#d1e7dd;
    color:#0f5132;
}

.error{
    background:#f8d7da;
    color:#842029;
}

/* LOADING */

.loading{
    text-align:center;
    padding:30px;
    color:#777;
}

/* MOBILE */

@media(max-width:700px){

    .container{
        padding:15px;
    }

    .tables{
        grid-template-columns:repeat(2,1fr);
    }

    .menu-grid{
        grid-template-columns:1fr;
    }

    .menu-image{
        height:190px;
    }

    .header-row{
        align-items:flex-start;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <div class="header-row">

        <div>

            <h1>🧑‍🍳 Waiter Panel</h1>

            <p>
                Restaurant Order Management
            </p>

        </div>

        <button
            class="logout"
            onclick="logout()"
        >
            🚪 Logout
        </button>

    </div>

</div>


<div class="container">


<!-- WELCOME -->

<div class="welcome">

    <h2>
        👋 Hello,
        <span id="waiterName">
            Waiter
        </span>
    </h2>

    <p>
        Waiter ID:
        <strong id="waiterId">
            -
        </strong>
    </p>

</div>


<div
    id="message"
    class="message"
></div>


<!-- TABLE SELECTION -->

<div class="section">

    <h2 class="section-title">
        🪑 Select Table
    </h2>

    <p class="description">
        Pehle customer ki table select karo.
    </p>


    <div
        id="tables"
        class="tables"
    >

        <!-- Tables generated by JS -->

    </div>

</div>


<!-- MENU -->

<div
    id="menuSection"
    class="section"
>

    <h2 class="section-title">
        🍔 Menu
    </h2>

    <p
        class="description"
        id="selectedTableText"
    >
        Table select karo.
    </p>


    <div
        id="menuList"
        class="menu-grid"
    >

        <div class="loading">
            Loading menu...
        </div>

    </div>

</div>


<!-- CART -->

<div
    id="cartSection"
    class="section"
>

    <h2 class="section-title">
        🛒 Current Order
    </h2>

    <p
        class="description"
        id="cartTableText"
    >
        No table selected.
    </p>


    <div id="cartList">

        <div class="empty">
            🛒 Cart empty hai.
        </div>

    </div>


    <div class="cart-total">

        <span>
            Total
        </span>

        <span id="cartTotal">
            ₹0
        </span>

    </div>


    <button
        id="placeOrderBtn"
        class="place-order"
        onclick="placeOrder()"
    >
        ✅ Place Order
    </button>

</div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://jxjrcjmrkhknltwvzzvr.supabase.co";

const SUPABASE_KEY =
"sb_publishable__Pg5UNoizrSpZB3fRvbARw_fNhHGjvl";


const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   STATE
========================================= */

let selectedTable = null;

let menuItems = [];

let cart = [];


/* =========================================
   WAITER INFO
========================================= */

const waiterId =
sessionStorage.getItem("waiter_id");

const waiterName =
sessionStorage.getItem("waiter_name");


if(!waiterId){

    window.location.href =
        "waiter.html";

}else{

    document
    .getElementById("waiterId")
    .innerText =
        waiterId;

    document
    .getElementById("waiterName")
    .innerText =
        waiterName || "Waiter";

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
    text,
    type
){

    const box =
        document.getElementById("message");

    box.innerText = text;

    box.className =
        "message " + type;

    box.style.display =
        "block";


    setTimeout(function(){

        box.style.display =
            "none";

    },4000);

}


/* =========================================
   TABLES
========================================= */

function createTables(){

    const box =
        document.getElementById("tables");

    box.innerHTML = "";


    for(
        let i = 1;
        i <= 10;
        i++
    ){

        box.innerHTML += `

            <button
                class="table-btn"
                id="table-${i}"
                onclick="selectTable(${i})"
            >

                <div class="table-icon">
                    🪑
                </div>

                <div class="table-name">
                    Table ${i}
                </div>

                <div class="table-status">
                    Available
                </div>

            </button>

        `;

    }

}


/* =========================================
   SELECT TABLE
========================================= */

function selectTable(tableNumber){

    selectedTable =
        tableNumber;


    /*
    Clear previous cart
    */

    cart = [];


    /*
    Remove active
    */

    document
    .querySelectorAll(".table-btn")
    .forEach(function(btn){

        btn.classList.remove(
            "active"
        );

    });


    /*
    Active table
    */

    document
    .getElementById(
        "table-" + tableNumber
    )
    .classList.add("active");


    /*
    Show menu
    */

    document
    .getElementById(
        "menuSection"
    )
    .style.display =
        "block";


    document
    .getElementById(
        "cartSection"
    )
    .style.display =
        "block";


    document
    .getElementById(
        "selectedTableText"
    )
    .innerText =
        "🪑 Table " +
        tableNumber +
        " selected";


    document
    .getElementById(
        "cartTableText"
    )
    .innerText =
        "Order for Table " +
        tableNumber;


    renderCart();


    /*
    Scroll to menu
    */

    document
    .getElementById(
        "menuSection"
    )
    .scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

}


/* =========================================
   LOAD MENU
========================================= */

async function loadMenu(){

    const box =
        document.getElementById(
            "menuList"
        );


    box.innerHTML =
        `
        <div class="loading">
            🍔 Loading menu...
        </div>
        `;


    try{

        const {
            data,
            error
        } = await db
        .from("menu_items")
        .select("*")
        .order(
            "id",
            {
                ascending:false
            }
        );


        if(error){

            console.error(error);

            box.innerHTML =
                `
                <div class="empty">
                    ❌ Menu load nahi hua.
                    <br><br>
                    ${error.message}
                </div>
                `;

            return;

        }


        menuItems =
            data || [];


        renderMenu();


    }catch(error){

        console.error(error);

        box.innerHTML =
            `
            <div class="empty">
                ❌ Something went wrong.
            </div>
            `;

    }

}


/* =========================================
   RENDER MENU
========================================= */

function renderMenu(){

    const box =
        document.getElementById(
            "menuList"
        );


    box.innerHTML = "";


    if(menuItems.length === 0){

        box.innerHTML =
            `
            <div class="empty">
                🍽️ Abhi menu available nahi hai.
            </div>
            `;

        return;

    }


    menuItems.forEach(function(item){

        const image =
            item.image_url ||
            "https://via.placeholder.com/500x300?text=Food";


        box.innerHTML += `

            <div class="menu-card">

                <img
                    class="menu-image"
                    src="${image}"
                    alt="${item.name}"
                >


                <div class="menu-content">

                    <div class="menu-name">
                        ${item.name}
                    </div>


                    <div class="menu-category">
                        ${item.category || ""}
                    </div>


                    <div class="menu-description">
                        ${item.description || ""}
                    </div>


                    <div class="menu-bottom">

                        <div class="price">
                            ₹${item.price}
                        </div>


                        <button
                            class="add-btn"
                            onclick="addToCart(${item.id})"
                        >
                            ➕ Add
                        </button>

                    </div>

                </div>

            </div>

        `;

    });

}


/* =========================================
   ADD TO CART
========================================= */

function addToCart(id){

    const item =
        menuItems.find(function(x){

            return x.id === id;

        });


    if(!item){

        return;

    }


    const existing =
        cart.find(function(x){

            return x.id === id;

        });


    if(existing){

        existing.quantity += 1;

    }else{

        cart.push({

            id:item.id,

            name:item.name,

            price:Number(item.price),

            quantity:1

        });

    }


    renderCart();


    showMessage(
        "✅ " +
        item.name +
        " cart me add ho gaya.",
        "success"
    );

}


/* =========================================
   CHANGE QUANTITY
========================================= */

function changeQuantity(
    id,
    change
){

    const item =
        cart.find(function(x){

            return x.id === id;

        });


    if(!item){

        return;

    }


    item.quantity += change;


    if(item.quantity <= 0){

        cart =
            cart.filter(function(x){

                return x.id !== id;

            });

    }


    renderCart();

}


/* =========================================
   RENDER CART
========================================= */

function renderCart(){

    const box =
        document.getElementById(
            "cartList"
        );


    const totalBox =
        document.getElementById(
            "cartTotal"
        );


    if(cart.length === 0){

        box.innerHTML =
            `
            <div class="empty">
                🛒 Cart empty hai.
            </div>
            `;

        totalBox.innerText =
            "₹0";

        return;

    }


    box.innerHTML = "";


    let total = 0;


    cart.forEach(function(item){

        const itemTotal =
            item.price *
            item.quantity;


        total += itemTotal;


        box.innerHTML += `

            <div class="cart-item">

                <div class="cart-info">

                    <div class="cart-name">
                        ${item.name}
                    </div>

                    <div class="cart-price">
                        ₹${item.price}
                        ×
                        ${item.quantity}
                    </div>

                </div>


                <div class="qty">

                    <button
                        onclick="changeQuantity(
                            ${item.id},
                            -1
                        )"
                    >
                        −
                    </button>


                    <span>
                        ${item.quantity}
                    </span>


                    <button
                        onclick="changeQuantity(
                            ${item.id},
                            1
                        )"
                    >
                        +
                    </button>

                </div>

            </div>

        `;

    });


    totalBox.innerText =
        "₹" + total;

}


/* =========================================
   PLACE ORDER
========================================= */

async function placeOrder(){

    if(!selectedTable){

        showMessage(
            "❌ Pehle table select karo.",
            "error"
        );

        return;

    }


    if(cart.length === 0){

        showMessage(
            "❌ Cart empty hai.",
            "error"
        );

        return;

    }


    const btn =
        document.getElementById(
            "placeOrderBtn"
        );


    btn.disabled = true;

    btn.innerText =
        "⏳ Placing Order...";


    let total = 0;


    cart.forEach(function(item){

        total +=
            item.price *
            item.quantity;

    });


    /*
    =========================================
    ORDER DATA
    =========================================
    */

    const orderData = {

        table_number:
            selectedTable,

        items:
            cart.map(function(item){

                return {

                    id:item.id,

                    name:item.name,

                    price:item.price,

                    quantity:item.quantity

                };

            }),

        total_amount:
            total,

        status:
            "pending"

    };


    try{


        const {
            data,
            error
        } = await db
        .from("orders")
        .insert([
            orderData
        ])
        .select()
        .single();


        if(error){

            console.error(error);

            showMessage(
                "❌ Order place nahi hua: " +
                error.message,
                "error"
            );

            btn.disabled = false;

            btn.innerText =
                "✅ Place Order";

            return;

        }


        /*
        =====================================
        SUCCESS
        =====================================
        */

        showMessage(
            "🎉 Order successfully placed! Table " +
            selectedTable,
            "success"
        );


        /*
        Clear cart
        */

        cart = [];


        renderCart();


        /*
        Keep table selected
        */

        btn.disabled = false;

        btn.innerText =
            "✅ Place Order";


        /*
        Scroll top
        */

        window.scrollTo({

            top:0,

            behavior:"smooth"

        });


    }catch(error){

        console.error(error);

        showMessage(
            "❌ Order place karte waqt error aaya: " +
            error.message,
            "error"
        );

        btn.disabled = false;

        btn.innerText =
            "✅ Place Order";

    }

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

    try{

        await db.auth.signOut();

    }catch(error){

        console.error(error);

    }


    sessionStorage.removeItem(
        "waiter_id"
    );

    sessionStorage.removeItem(
        "waiter_name"
    );

    localStorage.removeItem(
        "waiter_session"
    );


    window.location.href =
        "waiter.html";

}


/* =========================================
   START
========================================= */

createTables();

loadMenu();

</script>


</body>

</html>
