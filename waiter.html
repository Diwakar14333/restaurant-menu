<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waiter Panel</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222;padding-bottom:90px}
button,input{font:inherit}

.login{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:linear-gradient(135deg,#111,#333)
}

.box{
width:100%;
max-width:420px;
background:#fff;
padding:30px;
border-radius:24px;
box-shadow:0 18px 45px #0004
}

.logo{text-align:center;font-size:55px}
h1{text-align:center}
.sub{text-align:center;color:#777;font-size:13px;margin-bottom:20px}

label{
display:block;
font-weight:700;
margin:12px 0 6px
}

input{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:10px
}

.btn{
width:100%;
padding:13px;
background:#111;
color:#fff;
border:0;
border-radius:10px;
margin-top:14px
}

.msg{
display:none;
padding:12px;
border-radius:10px;
margin-bottom:10px
}

.err{background:#f8d7da;color:#842029}
.ok{background:#d1e7dd;color:#0f5132}

#app{display:none}

.header{
background:linear-gradient(135deg,#111,#292929);
color:#fff;
padding:16px;
position:sticky;
top:0;
z-index:20
}

.head{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between
}

.logout{
background:#fff;
border:0;
border-radius:9px;
padding:9px
}

.wrap{
max-width:1100px;
margin:auto;
padding:16px
}

.welcome,.section{
background:#fff;
border-radius:18px;
padding:18px;
margin-bottom:16px;
box-shadow:0 4px 16px #0000000c
}

.welcome{
background:#111;
color:#fff
}

.quick{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:14px
}

.quick div{
background:#ffffff14;
padding:11px;
border-radius:11px
}

.tables{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px
}

.table{
padding:14px 8px;
border:2px solid #eee;
background:#fafafa;
border-radius:15px;
text-align:center
}

.table.active{
background:#111;
color:#fff
}

.money{
font-size:10px;
color:#777;
margin-top:5px
}

.table.active .money{
color:#bbb
}

.toolbar{
display:flex;
gap:10px
}

.search{
flex:1
}

.pill{
background:#111;
color:#fff;
padding:11px;
border-radius:10px
}

.cats{
display:flex;
gap:8px;
overflow:auto;
padding:12px 0
}

.cat{
white-space:nowrap;
border:1px solid #ddd;
background:#fff;
border-radius:20px;
padding:9px 14px
}

.cat.active{
background:#111;
color:#fff
}

.menu{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px
}

.food{
background:#fff;
border:1px solid #eee;
border-radius:16px;
overflow:hidden
}

.food img{
width:100%;
height:180px;
object-fit:cover
}

.foodbody{
padding:14px
}

.foodbottom{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:12px
}

.add{
background:#111;
color:#fff;
border:0;
padding:10px;
border-radius:9px
}

.billgrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}

.bill{
background:#fff;
border:1px solid #eee;
border-radius:15px;
padding:15px
}

.billtop{
display:flex;
justify-content:space-between
}

.billtotal{
font-size:20px;
font-weight:800;
color:#198754
}

.billbtn{
width:100%;
margin-top:10px;
background:#111;
color:#fff;
border:0;
padding:11px;
border-radius:9px
}

.cartbar{
display:none;
position:fixed;
left:15px;
right:15px;
bottom:15px;
background:#111;
color:#fff;
padding:15px;
border-radius:14px;
z-index:30;
justify-content:space-between
}

.overlay{
position:fixed;
inset:0;
background:#0007;
display:none;
z-index:40
}

.drawer{
position:fixed;
right:0;
top:0;
width:min(520px,95vw);
height:100vh;
background:#f4f5f7;
transform:translateX(100%);
transition:.3s;
z-index:41;
display:flex;
flex-direction:column
}

.drawer.open{
transform:translateX(0)
}

.dh{
background:#111;
color:#fff;
padding:16px;
display:flex;
justify-content:space-between
}

.close{
border:0;
border-radius:50%;
width:36px;
height:36px
}

.db{
flex:1;
overflow:auto;
padding:15px
}

.item{
background:#fff;
padding:13px;
border-radius:12px;
margin-bottom:9px;
display:flex;
justify-content:space-between
}

.qty{
display:flex;
gap:8px;
align-items:center
}

.qty button{
width:30px;
height:30px;
background:#111;
color:#fff;
border:0;
border-radius:7px
}

.df{
background:#fff;
padding:15px
}

.row{
display:flex;
justify-content:space-between;
font-weight:800
}

.place,.pay{
width:100%;
background:#198754;
color:#fff;
border:0;
padding:14px;
border-radius:10px;
margin-top:10px
}

.source{
display:inline-block;
padding:5px 8px;
border-radius:18px;
font-size:10px;
font-weight:800
}

.customer{
background:#d1e7dd;
color:#0f5132
}

.waiter{
background:#cff4fc;
color:#055160
}

.line{
display:flex;
justify-content:space-between;
font-size:13px;
padding:4px 0
}

.empty{
text-align:center;
color:#777;
padding:30px
}

.error{
background:#f8d7da;
color:#842029;
padding:12px;
border-radius:10px
}

@media(max-width:800px){
.tables{grid-template-columns:repeat(3,1fr)}
.billgrid{grid-template-columns:1fr}
}

@media(max-width:600px){
.tables{grid-template-columns:repeat(2,1fr)}
.menu{grid-template-columns:1fr}
.toolbar{flex-direction:column}
.drawer{width:100vw}
}
</style>
</head>

<body>

<div id="login" class="login">

<div class="box">

<div class="logo">🧑‍🍳</div>

<h1>Waiter Login</h1>

<div class="sub">
Restaurant Waiter Panel
</div>

<div id="lm" class="msg"></div>

<form id="form">

<label>Waiter ID</label>

<input
id="wid"
placeholder="Example: W001"
required
>

<label>Password</label>

<input
id="pwd"
type="password"
required
>

<button
id="lb"
class="btn"
>
🔐 Login
</button>

</form>

</div>

</div>


<div id="app">

<div class="header">

<div class="head">

<div>

<b>🧑‍🍳 Waiter Panel</b>

<div
style="font-size:12px;color:#aaa"
id="hi"
>
Waiter
</div>

</div>

<button
class="logout"
onclick="logout()"
>
🚪 Logout
</button>

</div>

</div>


<div class="wrap">

<div class="welcome">

<h2>
👋 <span id="wn">Waiter</span>
</h2>

<small>
Waiter ID:
<span id="wi">-</span>
</small>

<div class="quick">

<div>
Open Tables
<br>
<b id="ot">0</b>
</div>

<div>
Unpaid
<br>
<b id="ua">₹0</b>
</div>

<div>
My Orders
<br>
<b id="mo">0</b>
</div>

</div>

</div>


<div id="am" class="msg"></div>


<div class="section">

<h2>
💳 All Table Bills
</h2>

<p style="color:#777;font-size:13px">
Kisi bhi table ka current-session bill collect karo.
</p>

<div
id="bills"
class="billgrid"
></div>

</div>


<div class="section">

<h2>
🪑 New Order
</h2>

<div
id="tables"
class="tables"
></div>

</div>


<div class="section">

<div class="toolbar">

<input
id="search"
class="search"
placeholder="🔍 Search food"
>

<div
id="pill"
class="pill"
>
Table -
</div>

</div>

<div
id="cats"
class="cats"
></div>

<div
id="menu"
class="menu"
></div>

</div>

</div>

</div>


<div
id="cart"
class="drawer"
>

<div class="dh">

<div>

<b>🛒 Current Order</b>

<small id="ct">
<br>No table
</small>

</div>

<button
class="close"
onclick="closeCart()"
>
×
</button>

</div>


<div
id="cl"
class="db"
></div>


<div class="df">

<div class="row">

<span>
Total
</span>

<span id="ctotal">
₹0
</span>

</div>

<button
class="place"
onclick="placeOrder()"
>
✅ Place Order
</button>

</div>

</div>


<div
id="billDrawer"
class="drawer"
>

<div class="dh">

<div>

<b>💳 Table Bill</b>

<small id="bt">
<br>Table -
</small>

</div>

<button
class="close"
onclick="closeBill()"
>
×
</button>

</div>


<div
id="bl"
class="db"
></div>


<div class="df">

<div class="row">

<span>Total</span>

<span id="btotal">
₹0
</span>

</div>


<div
style="display:flex;gap:7px"
>

<button
class="pay"
onclick="pay('cash')"
>
💵 Cash
</button>

<button
class="pay"
onclick="pay('upi')"
>
📱 UPI
</button>

<button
class="pay"
onclick="pay('card')"
>
💳 Card
</button>

</div>

</div>

</div>


<div
id="overlay"
class="overlay"
onclick="closeAll()"
></div>


<div
id="cartbar"
class="cartbar"
onclick="openCart()"
>

<span id="cc">
🛒 Cart (0)
</span>

<span id="cbar">
₹0
</span>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const U=
"https://jxjrcjmrkhknltwvzzvr.supabase.co";

const K=
"sb_publishable__Pg5UNoizrSpZB3fRvbARw_fNhHGjvl";

const db=
supabase.createClient(U,K);

let wid="";
let wn="";
let table=null;
let sessionId=null;
let billTable=null;
let menu=[];
let cart=[];
let cat="All";
let timer=null;


function msg(
id,
t,
c
){

let e=
document.getElementById(id);

e.textContent=t;

e.className=
"msg "+c;

e.style.display=
"block";

setTimeout(
()=>{
e.style.display="none"
},
4000
);

}


async function login(){

let id=
widInput.value.trim();

let p=
pwd.value;

if(!id||!p)return;

lb.disabled=true;

lb.textContent=
"⏳ Logging in...";

try{

let r=
await fetch(
U+
"/functions/v1/waiter-login",
{
method:"POST",
headers:{
"Content-Type":
"application/json",
"apikey":K
},
body:JSON.stringify({
waiter_id:id,
password:p
})
}
);

let x=
await r.json();

if(!r.ok||
!x.success){

throw Error(
x.message||
"Login failed"
);

}

let s=
await db.auth.setSession({
access_token:
x.session.access_token,
refresh_token:
x.session.refresh_token
});

if(s.error)throw s.error;

wid=
x.waiter.waiter_id;

wn=
x.waiter.name;

sessionStorage.setItem(
"waiter_id",
wid
);

sessionStorage.setItem(
"waiter_name",
wn
);

await showApp();

}catch(e){

msg(
"lm",
"❌ "+e.message,
"err"
);

}finally{

lb.disabled=false;

lb.textContent=
"🔐 Login";

}

}


const widInput=
document.getElementById("wid");

const pwd=
document.getElementById("pwd");

const lb=
document.getElementById("lb");

const form=
document.getElementById("form");


form.onsubmit=
e=>{
e.preventDefault();
login()
};


async function showApp(){

loginScreenHide();

document.getElementById(
"app"
).style.display=
"block";

wnEl.textContent=wn;

wi.textContent=wid;

hi.textContent=
wn+
" • "+
wid;

tables();

await loadMenu();

await loadBills();

clearInterval(timer);

timer=
setInterval(
loadBills,
10000
);

}


function loginScreenHide(){

document.getElementById(
"login"
).style.display=
"none";

}


const wnEl=
document.getElementById("wn");


function tables(){

let b=
document.getElementById(
"tables"
);

b.innerHTML="";

for(
let i=1;
i<=10;
i++
){

b.innerHTML+=`

<button
class="table"
id="t${i}"
onclick="selectTable(${i})"
>

<b>🪑</b>

Table ${i}

<div
class="money"
id="m${i}"
>
No unpaid bill
</div>

</button>

`;

}

}


async function selectTable(n){

table=
String(n);

let r=
await db.rpc(
"get_waiter_table_session",
{
p_table_number:
table
}
);

if(r.error){

return msg(
"am",
"❌ "+r.error.message,
"err"
);

}

sessionId=
r.data.id;

document
.querySelectorAll(".table")
.forEach(x=>
x.classList.remove("active")
);

document
.getElementById(
"t"+n
)
.classList.add("active");

pill.textContent=
"🪑 Table "+n;

ct.textContent=
"Table "+n;

cart=[];

renderCart();

document
.getElementById("menu")
.scrollIntoView({
behavior:"smooth"
});

}


async function loadMenu(){

try{

let r=
await db
.from("menu_items")
.select("*")
.order(
"id",
{ascending:false}
);

if(r.error)
throw r.error;

menu=
(r.data||[])
.map(x=>({

id:x.id,
name:x.name,
price:Number(x.price),
category:x.category||"Other",
desc:x.description||"",
image:x.image_url||
"https://via.placeholder.com/700x400?text=Food"

}));

cats();

render(menu);

}catch(e){

menuEl.innerHTML=
'<div class="error">'+
e.message+
'</div>';

}

}


const menuEl=
document.getElementById(
"menu"
);


function cats(){

let c=
document.getElementById(
"cats"
);

c.innerHTML="";


let a=
document.createElement(
"button"
);

a.className=
"cat active";

a.textContent=
"All";

a.onclick=
()=>filter("All",a);

c.appendChild(a);


[
...new Set(
menu.map(
x=>x.category
)
)
]
.forEach(x=>{

let b=
document.createElement(
"button"
);

b.className="cat";

b.textContent=x;

b.onclick=
()=>filter(x,b);

c.appendChild(b);

});

}


function filter(
x,
b
){

cat=x;

document
.querySelectorAll(".cat")
.forEach(y=>
y.classList.remove(
"active"
)
);

b.classList.add("active");

search();

}


document
.getElementById("search")
.oninput=
search;


function search(){

let q=
searchEl.value
.toLowerCase()
.trim();

render(
menu.filter(
x=>
x.name
.toLowerCase()
.includes(q) &&
(
cat==="All"||
x.category===cat
)
)
);

}


const searchEl=
document.getElementById(
"search"
);


function render(a){

menuEl.innerHTML="";

if(!a.length){

menuEl.innerHTML=
'<div class="empty">No food found</div>';

return;

}

a.forEach(x=>{

menuEl.innerHTML+=`

<div class="food">

<img
src="${x.image}"
onerror="
this.src=
'https://via.placeholder.com/700x400?text=Food'
"
>

<div class="foodbody">

<b>
${x.name}
</b>

<div
style="
color:#777;
font-size:13px"
>
${x.desc}
</div>

<div class="foodbottom">

<strong>
₹${x.price}
</strong>

<button
class="add"
onclick="add(${x.id})"
>
+ Add
</button>

</div>

</div>

</div>

`;

});

}


function add(id){

let x=
menu.find(
y=>y.id===id
);

let e=
cart.find(
y=>y.id===id
);

if(e){

e.q++;

}else{

cart.push({

id:x.id,
name:x.name,
price:x.price,
q:1

});

}

renderCart();

}


function q(i,d){

cart[i].q+=d;

if(cart[i].q<=0){

cart.splice(i,1);

}

renderCart();

}


function renderCart(){

let b=
document.getElementById(
"cl"
);

let n=0;
let t=0;

b.innerHTML="";

cart.forEach(
(x,i)=>{

n+=x.q;
t+=x.price*x.q;

b.innerHTML+=`

<div class="item">

<div>

<b>
${x.name}
</b>

<div
style="
font-size:12px;
color:#777"
>
${x.q}
×
₹${x.price}
</div>

</div>

<div class="qty">

<button
onclick="q(${i},-1)"
>
−
</button>

<span>
${x.q}
</span>

<button
onclick="q(${i},1)"
>
+
</button>

</div>

</div>

`;

});


if(!cart.length){

b.innerHTML=
'<div class="empty">🛒 Cart empty</div>';

}

ctotal.textContent=
"₹"+t;

cc.textContent=
"🛒 Cart ("+n+")";

cbar.textContent=
"₹"+t;

cartbar.style.display=
n?
"flex":
"none";

}


function openCart(){

closeBill();

cartDrawer();

}


function cartDrawer(){

cartEl.classList.add("open");

overlay.style.display=
"block";

}


function closeCart(){

cartEl.classList.remove(
"open"
);

if(
!billDrawerEl
.classList
.contains("open")
){

overlay.style.display=
"none";

}

}


const cartEl=
document.getElementById(
"cart"
);

const billDrawerEl=
document.getElementById(
"billDrawer"
);


async function placeOrder(){

if(!table){

return msg(
"am",
"❌ Pehle table select karo.",
"err"
);

}

if(!cart.length){

return msg(
"am",
"❌ Cart empty hai.",
"err"
);

}

if(!sessionId){

let r=
await db.rpc(
"get_waiter_table_session",
{
p_table_number:
table
}
);

if(r.error){

return msg(
"am",
"❌ "+r.error.message,
"err"
);

}

sessionId=
r.data.id;

}

let total=
cart.reduce(
(s,x)=>
s+x.price*x.q,
0
);

let items=
cart.map(
x=>({

id:x.id,
name:x.name,
price:x.price,
quantity:x.q

})
);


try{

let r=
await db.rpc(
"create_waiter_order",
{
p_table_number:
table,

p_items:
items,

p_total_amount:
total,

p_session_id:
sessionId

}
);

if(r.error)
throw r.error;

cart=[];

renderCart();

closeCart();

await loadBills();

msg(
"am",
"✅ Order #"+
r.data.id+
" placed for Table "+
table,
"ok"
);

}catch(e){

msg(
"am",
"❌ "+e.message,
"err"
);

}

}


async function loadBills(){

try{

let r=
await db
.from("orders")
.select("*")
.neq(
"payment_status",
"paid"
)
.order(
"created_at",
{ascending:false}
);

if(r.error)
throw r.error;

let gs={};
let open=0;
let total=0;
let my=0;


(r.data||[])
.forEach(o=>{

let t=
String(
o.table_number||"-"
);

(
gs[t]??=[]
)
.push(o);

});


Object.keys(gs).forEach(t=>{

let a=
gs[t];

let v=
a.reduce(
(s,o)=>
s+
Number(
o.total_amount||0
),
0
);

open++;

total+=v;


a.forEach(o=>{

if(
o.waiter_id===wid
){

my++;

}

});


for(
let i=1;
i<=10;
i++
){

if(
String(i)===t
){

document
.getElementById(
"m"+i
)
.textContent=
"Unpaid ₹"+v;

}

}

});


ot.textContent=
open;

ua.textContent=
"₹"+total;

mo.textContent=
my;


let b=
document.getElementById(
"bills"
);

b.innerHTML="";


if(!Object.keys(gs).length){

b.innerHTML=
'<div class="empty">✅ No unpaid bills</div>';

return;

}


Object.keys(gs)
.sort(
(a,b)=>
Number(a)-Number(b)
)
.forEach(t=>{

let v=
gs[t].reduce(
(s,o)=>
s+
Number(
o.total_amount||0
),
0
);


b.innerHTML+=`

<div class="bill">

<div class="billtop">

<div>

<b>
🪑 Table ${t}
</b>

<div
style="
color:#777;
font-size:11px"
>

active order(s)

class="billtotal"
>

</div>

`;

});

}catch(e){

document.getElementById(

).innerHTML=

}


async function openBill(t){

closeCart();

billTable=
String(t);

bt.textContent=
"Table "+t;

billDrawerEl.classList.add(
"open"
);

overlay.style.display=
"block";


try{

let r=
await db
.from("orders")
.select("*")
.eq(
"table_number",
billTable
)
.neq(
"payment_status",
"paid"
)
.order(
"created_at",
{ascending:false}
);

if(r.error)
throw r.error;

let sum=0;
let html="";


(r.data||[])
.forEach(o=>{

sum+=
Number(
o.total_amount||0
);

let items=
typeof o.items==="string"
?
JSON.parse(o.items)
:
o.items;

let lines="";


(items||[])
.forEach(i=>{

lines+=`

<div class="line">

<span>
${i.name}
×
${i.quantity||1}
</span>

<span>
₹${
Number(i.price)*
Number(i.quantity||1)
}
</span>

</div>

`;

});


let w=
o.order_source==="waiter";


html+=`

<div class="item">

<b>
Order #${o.id}
</b>

<div>

<span
class="source ${
w?
"waiter":
"customer"
}"
>

${
w?
"🔵 WAITER • "+
(o.waiter_name||""):
"🟢 CUSTOMER"
}

</span>

</div>

<div>
${lines}
</div>

<hr>

<div class="row">

<span>
Total
</span>

<span>
₹${o.total_amount}
</span>

</div>

</div>

`;

});


document.getElementById(
"bl"
).innerHTML=
html||
'<div class="empty">No unpaid orders</div>';

btotal.textContent=
"₹"+sum;

}catch(e){

document.getElementById(
"bl"
).innerHTML=
'<div class="error">'+
e.message+
'</div>';

}

}


async function pay(
method
){

if(!billTable)
return;


if(
!confirm(
"Table "+
billTable+
" ka full bill "+
method.toUpperCase()+
" se paid karna hai?"
)
){

return;

}


try{

let r=
await db.rpc(
"collect_table_payment",
{
p_table_number:
billTable,

p_payment_method:
method

}
);

if(r.error)
throw r.error;

if(
!r.data.success
)
throw Error(
r.data.message
);


alert(
"✅ Payment collected\n"+
"Amount: ₹"+
r.data.amount+
"\nCollected by: "+
r.data.collected_by_name
);

closeBill();

await loadBills();

}catch(e){

alert(
"❌ "+e.message
);

}

}


function closeBill(){

billDrawerEl.classList.remove(
"open"
);

if(
!cartEl.classList.contains(
"open"
)
){

overlay.style.display=
"none";

}

}


function closeAll(){

closeCart();

closeBill();

overlay.style.display=
"none";

}


async function logout(){

clearInterval(timer);

await db.auth.signOut();

sessionStorage.clear();

location.reload();

}


async function restore(){

let r=
await db.auth.getSession();

if(!r.data.session)
return;

wid=
sessionStorage.getItem(
"waiter_id"
);

wn=
sessionStorage.getItem(
"waiter_name"
);

if(wid)
showApp();

}


restore();

</script>
