<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Waiter Login</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#111,#333);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:22px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    font-size:55px;
    margin-bottom:10px;
}

h1{
    text-align:center;
    font-size:26px;
    color:#111;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-top:7px;
    margin-bottom:25px;
    font-size:14px;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#111;
}

.login-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#111;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.forgot{
    text-align:center;
    margin-top:18px;
}

.forgot button{
    border:0;
    background:none;
    color:#333;
    text-decoration:underline;
    cursor:pointer;
    font-size:14px;
}

.message{
    display:none;
    padding:12px;
    border-radius:9px;
    margin-bottom:15px;
    font-size:14px;
}

.error{
    background:#f8d7da;
    color:#842029;
}

.success{
    background:#d1e7dd;
    color:#0f5132;
}

#forgotBox{
    display:none;
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #eee;
}

.secondary-btn{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#eee;
    color:#222;
    cursor:pointer;
}

</style>

</head>


<body>


<div class="login-box">

    <div class="logo">🧑‍🍳</div>

    <h1>Waiter Login</h1>

    <p class="subtitle">
        Restaurant Waiter Panel
    </p>


    <div
        id="loginError"
        class="message error"
    ></div>


    <div
        id="loginSuccess"
        class="message success"
    ></div>


    <!-- =========================
         LOGIN
    ========================== -->

    <form id="loginForm">

        <div class="form-group">

            <label>
                Waiter ID
            </label>

            <input
                type="text"
                id="waiterId"
                placeholder="Enter waiter ID"
                required
                autocomplete="username"
            >

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
                autocomplete="current-password"
            >

        </div>


        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >
            🔐 Login
        </button>

    </form>


    <div class="forgot">

        <button
            type="button"
            onclick="showForgot()"
        >
            Forgot Password?
        </button>

    </div>


    <!-- =========================
         FORGOT PASSWORD
    ========================== -->

    <div id="forgotBox">

        <h3>
            🔑 Reset Password
        </h3>

        <p
            style="color:#777;font-size:13px;margin:8px 0 15px"
        >
            Apna Waiter ID enter karo.
            Registered email par password reset mail bheja jayega.
        </p>


        <div class="form-group">

            <label>
                Waiter ID
            </label>

            <input
                type="text"
                id="resetWaiterId"
                placeholder="Enter waiter ID"
            >

        </div>


        <button
            type="button"
            class="login-btn"
            id="resetBtn"
            onclick="sendResetEmail()"
        >
            📧 Send Reset Email
        </button>


        <button
            type="button"
            class="secondary-btn"
            onclick="hideForgot()"
        >
            ← Back to Login
        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://jxjrcjmrkhknltwvzzvr.supabase.co";

const SUPABASE_KEY =
"sb_publishable__Pg5UNoizrSpZB3fRvbARw_fNhHGjvl";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==========================================
   ELEMENTS
========================================== */

const loginForm =
document.getElementById("loginForm");

const loginBtn =
document.getElementById("loginBtn");

const loginError =
document.getElementById("loginError");

const loginSuccess =
document.getElementById("loginSuccess");


/* ==========================================
   MESSAGES
========================================== */

function showError(message){

    loginSuccess.style.display="none";

    loginError.innerText =
        "❌ " + message;

    loginError.style.display="block";
}


function showSuccess(message){

    loginError.style.display="none";

    loginSuccess.innerText =
        "✅ " + message;

    loginSuccess.style.display="block";
}


function clearMessages(){

    loginError.style.display="none";
    loginSuccess.style.display="none";

}


/* ==========================================
   WAITER LOGIN
========================================== */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessages();


        const waiterId =
            document.getElementById("waiterId")
            .value
            .trim();


        const password =
            document.getElementById("password")
            .value;


        if(!waiterId){

            showError(
                "Waiter ID enter karo."
            );

            return;
        }


        if(!password){

            showError(
                "Password enter karo."
            );

            return;
        }


        loginBtn.disabled=true;

        loginBtn.innerText =
            "⏳ Checking...";


        try{


            /*
            ==========================================
            WAITER TABLE CHECK
            ==========================================
            */

            const {
                data,
                error
            } = await db
                .from("waiters")
                .select("*")
                .eq("waiter_id", waiterId)
                .maybeSingle();


            if(error){

                console.error(error);

                showError(
                    "Waiter data check nahi ho pa raha: " +
                    error.message
                );

                loginBtn.disabled=false;

                loginBtn.innerText =
                    "🔐 Login";

                return;
            }


            /*
            ==========================================
            WAITER NOT FOUND
            ==========================================
            */

            if(!data){

                showError(
                    "Waiter ID ya password galat hai."
                );

                loginBtn.disabled=false;

                loginBtn.innerText =
                    "🔐 Login";

                return;
            }


            /*
            ==========================================
            PASSWORD CHECK
            ==========================================
            */

            if(data.password !== password){

                showError(
                    "Waiter ID ya password galat hai."
                );

                loginBtn.disabled=false;

                loginBtn.innerText =
                    "🔐 Login";

                return;
            }


            /*
            ==========================================
            LOGIN SUCCESS
            ==========================================
            */

            sessionStorage.setItem(
                "waiter_id",
                data.waiter_id
            );


            sessionStorage.setItem(
                "waiter_name",
                data.name || data.waiter_id
            );


            showSuccess(
                "Login successful! Waiter panel opening..."
            );


            setTimeout(function(){

                window.location.href =
                    "waiter-dashboard.html";

            },700);


        }catch(error){

            console.error(error);

            showError(
                "Login ke time error aaya: " +
                error.message
            );

            loginBtn.disabled=false;

            loginBtn.innerText =
                "🔐 Login";

        }

    }
);


/* ==========================================
   FORGOT PASSWORD
========================================== */

function showForgot(){

    clearMessages();

    document.getElementById("loginForm")
        .style.display="none";

    document.querySelector(".forgot")
        .style.display="none";

    document.getElementById("forgotBox")
        .style.display="block";

}


function hideForgot(){

    clearMessages();

    document.getElementById("forgotBox")
        .style.display="none";

    document.getElementById("loginForm")
        .style.display="block";

    document.querySelector(".forgot")
        .style.display="block";

}


/* ==========================================
   SEND RESET EMAIL
========================================== */

async function sendResetEmail(){

    clearMessages();


    const waiterId =
        document.getElementById("resetWaiterId")
        .value
        .trim();


    if(!waiterId){

        showError(
            "Waiter ID enter karo."
        );

        return;
    }


    const resetBtn =
        document.getElementById("resetBtn");


    resetBtn.disabled=true;

    resetBtn.innerText =
        "⏳ Checking...";


    try{


        /*
        ==========================================
        GET WAITER EMAIL
        ==========================================
        */

        const {
            data,
            error
        } = await db
            .from("waiters")
            .select("email")
            .eq("waiter_id", waiterId)
            .maybeSingle();


        if(error){

            console.error(error);

            showError(
                "Waiter details nahi mil rahe: " +
                error.message
            );

            resetBtn.disabled=false;

            resetBtn.innerText =
                "📧 Send Reset Email";

            return;
        }


        if(!data){

            showError(
                "Waiter ID nahi mila."
            );

            resetBtn.disabled=false;

            resetBtn.innerText =
                "📧 Send Reset Email";

            return;
        }


        if(!data.email){

            showError(
                "Is waiter ke account me email registered nahi hai."
            );

            resetBtn.disabled=false;

            resetBtn.innerText =
                "📧 Send Reset Email";

            return;
        }


        /*
        ==========================================
        RESET REDIRECT
        ==========================================
        */

        const redirectUrl =
            window.location.origin +
            window.location.pathname
            .replace(
                "waiter.html",
                "reset-password.html"
            );


        resetBtn.innerText =
            "⏳ Sending...";


        /*
        ==========================================
        SUPABASE RESET EMAIL
        ==========================================
        */

        const {
            error:resetError
        } = await db.auth
            .resetPasswordForEmail(
                data.email,
                {
                    redirectTo:redirectUrl
                }
            );


        if(resetError){

            console.error(resetError);

            showError(
                "Reset email nahi bheja gaya: " +
                resetError.message
            );

            resetBtn.disabled=false;

            resetBtn.innerText =
                "📧 Send Reset Email";

            return;
        }


        showSuccess(
            "Password reset email registered email par bhej diya gaya."
        );


        resetBtn.disabled=false;

        resetBtn.innerText =
            "📧 Send Reset Email";


    }catch(error){

        console.error(error);

        showError(
            "Reset ke time error aaya: " +
            error.message
        );


        resetBtn.disabled=false;

        resetBtn.innerText =
            "📧 Send Reset Email";

    }

}


/* ==========================================
   START
========================================== */

</script>


</body>

</html>
