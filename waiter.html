<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Waiter Login</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#111,#333);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:22px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    font-size:55px;
    margin-bottom:10px;
}

h1{
    text-align:center;
    font-size:26px;
    color:#111;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-top:7px;
    margin-bottom:25px;
    font-size:14px;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#111;
}

.login-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#111;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.forgot{
    text-align:center;
    margin-top:18px;
}

.forgot button{
    border:0;
    background:none;
    color:#333;
    text-decoration:underline;
    cursor:pointer;
    font-size:14px;
}

.message{
    display:none;
    padding:12px;
    border-radius:9px;
    margin-bottom:15px;
    font-size:14px;
}

.error{
    background:#f8d7da;
    color:#842029;
}

.success{
    background:#d1e7dd;
    color:#0f5132;
}

#forgotBox{
    display:none;
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #eee;
}

.secondary-btn{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#eee;
    color:#222;
    cursor:pointer;
}

.hidden{
    display:none;
}

</style>

</head>

<body>


<div class="login-box">

    <div class="logo">🧑‍🍳</div>

    <h1>Waiter Login</h1>

    <p class="subtitle">
        Restaurant Waiter Panel
    </p>


    <div
        id="loginError"
        class="message error"
    ></div>


    <div
        id="loginSuccess"
        class="message success"
    ></div>


    <!-- LOGIN -->

    <form id="loginForm">

        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter waiter email"
                required
                autocomplete="email"
            >

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
                autocomplete="current-password"
            >

        </div>


        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >
            🔐 Login
        </button>

    </form>


    <div class="forgot">

        <button
            type="button"
            onclick="showForgot()"
        >
            Forgot Password?
        </button>

    </div>


    <!-- FORGOT PASSWORD -->

    <div id="forgotBox">

        <h3>
            🔑 Reset Password
        </h3>

        <p
            style="color:#777;font-size:13px;margin:8px 0 15px"
        >
            Apna registered email enter karo.
            Reset instructions email par bheje jayenge.
        </p>


        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                id="resetEmail"
                placeholder="Enter registered email"
            >

        </div>


        <button
            type="button"
            class="login-btn"
            id="resetBtn"
            onclick="sendResetEmail()"
        >
            📧 Send Reset Email
        </button>


        <button
            type="button"
            class="secondary-btn"
            onclick="hideForgot()"
        >
            ← Back to Login
        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://jxjrcjmrkhknltwvzzvr.supabase.co";

const SUPABASE_KEY =
"sb_publishable__Pg5UNoizrSpZB3fRvbARw_fNhHGjvl";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==========================================
   ELEMENTS
========================================== */

const loginForm =
document.getElementById("loginForm");

const loginBtn =
document.getElementById("loginBtn");

const loginError =
document.getElementById("loginError");

const loginSuccess =
document.getElementById("loginSuccess");


/* ==========================================
   MESSAGE FUNCTIONS
========================================== */

function showLoginError(message){

    loginSuccess.style.display="none";

    loginError.innerText =
        "❌ " + message;

    loginError.style.display="block";
}


function showLoginSuccess(message){

    loginError.style.display="none";

    loginSuccess.innerText =
        "✅ " + message;

    loginSuccess.style.display="block";
}


function clearMessages(){

    loginError.style.display="none";
    loginSuccess.style.display="none";

}


/* ==========================================
   LOGIN
========================================== */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessages();

        const email =
            document.getElementById("email")
            .value
            .trim();

        const password =
            document.getElementById("password")
            .value;


        if(!email){

            showLoginError(
                "Email enter karo."
            );

            return;
        }


        if(!password){

            showLoginError(
                "Password enter karo."
            );

            return;
        }


        loginBtn.disabled=true;

        loginBtn.innerText =
            "⏳ Logging in...";


        try{

            const {
                data,
                error
            } = await db.auth.signInWithPassword({

                email:email,

                password:password

            });


            if(error){

                console.error(error);


                /*
                 LOGIN FAILED
                */

                if(
                    error.message
                    .toLowerCase()
                    .includes("invalid login credentials")
                ){

                    showLoginError(
                        "Email ya password galat hai."
                    );

                }else{

                    showLoginError(
                        error.message
                    );

                }


                loginBtn.disabled=false;

                loginBtn.innerText =
                    "🔐 Login";

                return;

            }


            /*
             LOGIN SUCCESS
            */

            showLoginSuccess(
                "Login successful! Opening waiter panel..."
            );


            /*
             THODA DELAY
             */

            setTimeout(function(){

                /*
                 waiter-dashboard.html
                 ko baad mein isi naam se
                 GitHub par rakhna.
                */

                window.location.href =
                    "waiter-dashboard.html";

            },800);


        }catch(error){

            console.error(error);

            showLoginError(
                "Login ke time error aaya: " +
                error.message
            );


            loginBtn.disabled=false;

            loginBtn.innerText =
                "🔐 Login";

        }

    }
);


/* ==========================================
   FORGOT PASSWORD
========================================== */

function showForgot(){

    clearMessages();

    document.getElementById("loginForm")
        .style.display="none";

    document.querySelector(".forgot")
        .style.display="none";

    document.getElementById("forgotBox")
        .style.display="block";

}


function hideForgot(){

    clearMessages();

    document.getElementById("forgotBox")
        .style.display="none";

    document.getElementById("loginForm")
        .style.display="block";

    document.querySelector(".forgot")
        .style.display="block";

}


/* ==========================================
   SEND RESET EMAIL
========================================== */

async function sendResetEmail(){

    clearMessages();

    const email =
        document.getElementById("resetEmail")
        .value
        .trim();


    if(!email){

        showLoginError(
            "Registered email enter karo."
        );

        return;

    }


    const resetBtn =
        document.getElementById("resetBtn");


    resetBtn.disabled=true;

    resetBtn.innerText =
        "⏳ Sending...";


    try{

        /*
         IMPORTANT:
         Apne GitHub Pages URL ko yahan rakho.
        */

        const redirectUrl =
            window.location.origin +
            window.location.pathname
            .replace(
                "waiter.html",
                "reset-password.html"
            );


        const {
            error
        } = await db.auth.resetPasswordForEmail(

            email,

            {
                redirectTo:redirectUrl
            }

        );


        if(error){

            console.error(error);

            showLoginError(
                "Reset email nahi bheja gaya: " +
                error.message
            );

            resetBtn.disabled=false;

            resetBtn.innerText =
                "📧 Send Reset Email";

            return;

        }


        showLoginSuccess(
            "Password reset email bhej diya gaya. Email inbox/spam check karo."
        );


        resetBtn.disabled=false;

        resetBtn.innerText =
            "📧 Send Reset Email";


    }catch(error){

        console.error(error);

        showLoginError(
            "Reset error: " +
            error.message
        );


        resetBtn.disabled=false;

        resetBtn.innerText =
            "📧 Send Reset Email";

    }

}


/* ==========================================
   CHECK EXISTING SESSION
========================================== */

async function checkSession(){

    const {
        data
    } = await db.auth.getSession();


    if(
        data &&
        data.session
    ){

        /*
         Agar already logged in hai
         to waiter dashboard khol do.
        */

        window.location.href =
            "waiter-dashboard.html";

    }

}


checkSession();


</script>


</body>
</html>
