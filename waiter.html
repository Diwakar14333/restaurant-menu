<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Waiter Panel</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f5f5;color:#222;padding-bottom:90px}
button,input{font:inherit}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#111,#333)}
.login-box{width:100%;max-width:420px;background:#fff;border-radius:22px;padding:30px;box-shadow:0 15px 40px #0004}
.logo{text-align:center;font-size:55px}
h1{text-align:center;margin:8px 0}
.sub{text-align:center;color:#777;font-size:14px;margin-bottom:22px}
label{display:block;font-weight:bold;margin:12px 0 6px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;outline:none}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#111;color:#fff;cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.6}
.msg{display:none;padding:12px;border-radius:10px;margin-bottom:12px;font-size:14px}
.err{background:#f8d7da;color:#842029}
.ok{background:#d1e7dd;color:#0f5132}
.forgot{display:block;text-align:center;margin-top:16px;color:#555;cursor:pointer;font-size:14px}
#app{display:none}
.header{background:#111;color:#fff;padding:16px;position:sticky;top:0;z-index:50}
.head{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.head p{color:#bbb;font-size:12px;margin-top:3px}
.logout{background:#fff;color:#111;border:0;padding:9px 12px;border-radius:9px;cursor:pointer}
.container{max-width:1000px;margin:auto;padding:16px}
.welcome,.section{background:#fff;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 4px 15px #0000000d}
.welcome{background:linear-gradient(135deg,#111,#292929);color:#fff}
.welcome small{color:#bbb}
.tables{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.table{background:#fafafa;border:2px solid #eee;border-radius:14px;padding:16px;text-align:center;cursor:pointer}
.table.active{background:#111;color:#fff;border-color:#111}
.table b{display:block;font-size:22px;margin-bottom:5px}
.toolbar{display:flex;gap:10px;margin-bottom:12px}
.search{flex:1}
.pill{background:#111;color:#fff;padding:11px 13px;border-radius:10px;white-space:nowrap}
.cats{display:flex;gap:8px;overflow:auto;margin-bottom:15px}
.cat{white-space:nowrap;padding:9px 14px;border:1px solid #ddd;border-radius:20px;background:#fff;cursor:pointer}
.cat.active{background:#111;color:#fff}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.food{background:#fff;border:1px solid #eee;border-radius:16px;overflow:hidden}
.food img{width:100%;height:180px;object-fit:cover;display:block;background:#eee}
.food-body{padding:14px}
.food-name{font-weight:bold;font-size:17px}
.food-desc{color:#777;font-size:13px;line-height:1.4;margin-top:6px}
.food-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:13px}
.add{background:#111;color:#fff;border:0;padding:10px 14px;border-radius:9px;cursor:pointer}
.cartbar{display:none;position:fixed;bottom:15px;left:15px;right:15px;background:#111;color:#fff;padding:15px;border-radius:14px;z-index:100;justify-content:space-between;cursor:pointer;box-shadow:0 8px 25px #0004}
.overlay{position:fixed;inset:0;background:#0007;display:none;z-index:200}
.drawer{position:fixed;right:0;top:0;width:min(500px,94vw);height:100vh;background:#f5f5f5;transform:translateX(100%);transition:.25s;z-index:201;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer.open+.overlay{display:block}
.drawer-head{background:#111;color:#fff;padding:16px;display:flex;justify-content:space-between}
.close{background:#fff;border:0;border-radius:50%;width:36px;height:36px;cursor:pointer}
.drawer-body{flex:1;overflow:auto;padding:14px}
.cart-item{background:#fff;padding:13px;border-radius:12px;margin-bottom:9px;display:flex;justify-content:space-between;gap:10px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border:0;background:#111;color:#fff;border-radius:7px}
.drawer-foot{background:#fff;padding:15px;border-top:1px solid #ddd}
.total{display:flex;justify-content:space-between;font-weight:bold;font-size:18px}
.place{width:100%;border:0;background:#198754;color:#fff;padding:14px;border-radius:10px;margin-top:10px;font-weight:bold;cursor:pointer}
.empty,.loading{text-align:center;color:#777;padding:30px}
@media(max-width:700px){.tables{grid-template-columns:repeat(2,1fr)}.menu{grid-template-columns:1fr}.toolbar{flex-direction:column}.drawer{width:100vw}}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap">
<div class="login-box">

<div class="logo">🧑‍🍳</div>
<h1>Waiter Login</h1>
<div class="sub">Restaurant Waiter Panel</div>

<div id="loginMsg" class="msg"></div>

<form id="loginForm">

<label>Waiter ID</label>
<input id="waiterIdInput" placeholder="Example: W001" required>

<label>Password</label>
<input id="passwordInput" type="password" placeholder="Password" required>

<button id="loginBtn" class="btn" type="submit">🔐 Login</button>

</form>

<div class="forgot" onclick="forgotPassword()">
Forgot Password?
</div>

</div>
</div>


<!-- APP -->
<div id="app">

<div class="header">
<div class="head">
<div>
<h2>🧑‍🍳 Waiter Panel</h2>
<p id="headerInfo">Waiter</p>
</div>
<button class="logout" onclick="logout()">🚪 Logout</button>
</div>
</div>

<div class="container">

<div class="welcome">
<h2>👋 Hello, <span id="waiterName">Waiter</span></h2>
<small>Waiter ID: <span id="waiterIdText">-</span></small>
</div>

<div id="appMsg" class="msg"></div>

<div class="section">
<h2>🪑 Select Table</h2>
<p style="color:#777;font-size:13px;margin:6px 0 15px">Customer ki table select karo.</p>
<div id="tables" class="tables"></div>
</div>

<div class="section">

<div class="toolbar">
<input id="search" class="search" placeholder="🔍 Search food...">
<div id="tablePill" class="pill">Table -</div>
</div>

<div id="categories" class="cats"></div>

<div id="menu" class="menu">
<div class="loading">🍽️ Loading menu...</div>
</div>

</div>

</div>
</div>


<!-- CART DRAWER -->
<div id="drawer" class="drawer">
<div class="drawer-head">
<div>
<h3>🛒 Current Order</h3>
<small id="drawerTable">No table</small>
</div>
<button class="close" onclick="closeCart()">×</button>
</div>

<div id="cartList" class="drawer-body"></div>

<div class="drawer-foot">
<div class="total">
<span>Total</span>
<span id="cartTotal">₹0</span>
</div>
<button id="placeBtn" class="place" onclick="placeOrder()">✅ Place Order</button>
</div>
</div>

<div id="overlay" class="overlay" onclick="closeCart()"></div>

<div id="cartBar" class="cartbar" onclick="openCart()">
<span id="cartCount">🛒 Cart (0)</span>
<span id="barTotal">₹0</span>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL="https://jxjrcjmrkhknltwvzzvr.supabase.co";
const SUPABASE_KEY="sb_publishable__Pg5UNoizrSpZB3fRvbARw_fNhHGjvl";

const db=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let waiterId="";
let waiterName="";
let selectedTable=null;
let menuItems=[];
let cart=[];
let category="All";

function msg(id,text,type){
const el=document.getElementById(id);
el.innerText=text;
el.className="msg "+type;
el.style.display="block";
setTimeout(()=>el.style.display="none",4000);
}

async function login(){

const id=document.getElementById("waiterIdInput").value.trim();
const password=document.getElementById("passwordInput").value;

if(!id || !password){
msg("loginMsg","❌ Waiter ID aur password required hai.","err");
return;
}

const btn=document.getElementById("loginBtn");
btn.disabled=true;
btn.innerText="⏳ Logging in...";

try{

const response=await fetch(
SUPABASE_URL+"/functions/v1/waiter-login",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY
},
body:JSON.stringify({
waiter_id:id,
password:password
})
}
);

const result=await response.json();

if(!response.ok || !result.success){
throw new Error(result.message||"Waiter ID ya password galat hai.");
}

/* VERY IMPORTANT: save Auth session */
const {error:sessionError}=await db.auth.setSession({
access_token:result.session.access_token,
refresh_token:result.session.refresh_token
});

if(sessionError) throw sessionError;

waiterId=result.waiter.waiter_id;
waiterName=result.waiter.name||"Waiter";

sessionStorage.setItem("waiter_id",waiterId);
sessionStorage.setItem("waiter_name",waiterName);

showApp();

}catch(error){

console.error(error);

msg(
"loginMsg",
"❌ "+error.message,
"err"
);

}finally{

btn.disabled=false;
btn.innerText="🔐 Login";

}
}

document.getElementById("loginForm").addEventListener("submit",function(e){
e.preventDefault();
login();
});

async function showApp(){

document.getElementById("loginScreen").style.display="none";
document.getElementById("app").style.display="block";

document.getElementById("waiterName").innerText=waiterName;
document.getElementById("waiterIdText").innerText=waiterId;
document.getElementById("headerInfo").innerText=waiterName+" • "+waiterId;

createTables();
await loadMenu();

}

function createTables(){

const box=document.getElementById("tables");
box.innerHTML="";

for(let i=1;i<=10;i++){

box.innerHTML+=`
<button class="table" id="t${i}" onclick="selectTable(${i})">
<b>🪑</b>
Table ${i}
</button>
`;

}
}

function selectTable(number){

selectedTable=String(number);

document.querySelectorAll(".table").forEach(x=>x.classList.remove("active"));

document.getElementById("t"+number).classList.add("active");

document.getElementById("tablePill").innerText="🪑 Table "+number;
document.getElementById("drawerTable").innerText="Order for Table "+number;

cart=[];
renderCart();

document.getElementById("menu").scrollIntoView({
behavior:"smooth",
block:"start"
});

}

async function loadMenu(){

const menu=document.getElementById("menu");

menu.innerHTML='<div class="loading">🍽️ Loading menu...</div>';

try{

const {data,error}=await db
.from("menu_items")
.select("*")
.order("id",{ascending:false});

if(error)throw error;

menuItems=(data||[]).map(x=>({
id:x.id,
name:x.name,
price:Number(x.price),
category:x.category||"Other",
description:x.description||"",
image:x.image_url||""
}));

createCategories();
renderMenu(menuItems);

}catch(error){

console.error(error);

menu.innerHTML=`
<div class="empty">
❌ Menu load nahi hua.<br><br>
${error.message}
</div>
`;

}
}

function createCategories(){

const box=document.getElementById("categories");
box.innerHTML="";
category="All";

const all=document.createElement("button");
all.className="cat active";
all.innerText="All";
all.onclick=()=>filterCategory("All",all);
box.appendChild(all);

[...new Set(menuItems.map(x=>x.category).filter(Boolean))].forEach(c=>{
const b=document.createElement("button");
b.className="cat";
b.innerText=c;
b.onclick=()=>filterCategory(c,b);
box.appendChild(b);
});

}

function filterCategory(c,button){

category=c;

document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
button.classList.add("active");

filterMenu();

}

document.getElementById("search").addEventListener("input",filterMenu);

function filterMenu(){

const text=document.getElementById("search").value.toLowerCase().trim();

let list=menuItems.filter(x=>x.name.toLowerCase().includes(text));

if(category!=="All")
list=list.filter(x=>x.category===category);

renderMenu(list);

}

function renderMenu(list){

const box=document.getElementById("menu");
box.innerHTML="";

if(!list.length){
box.innerHTML='<div class="empty">😕 No food found.</div>';
return;
}

list.forEach(item=>{

box.innerHTML+=`
<div class="food">

<img
src="${item.image||"https://via.placeholder.com/700x400?text=Food"}"
alt="${item.name}"
onerror="this.src='https://via.placeholder.com/700x400?text=Food'"
>

<div class="food-body">

<div class="food-name">${item.name}</div>

<div class="food-desc">${item.description}</div>

<div class="food-bottom">

<strong>₹${item.price}</strong>

<button class="add" onclick="addToCart(${item.id})">
+ Add
</button>

</div>

</div>
</div>
`;
});
}

function addToCart(id){

const item=menuItems.find(x=>x.id===id);
if(!item)return;

const old=cart.find(x=>x.id===id);

if(old)old.quantity++;
else cart.push({
id:item.id,
name:item.name,
price:item.price,
quantity:1
});

renderCart();
}

function changeQty(index,change){

cart[index].quantity+=change;

if(cart[index].quantity<=0)
cart.splice(index,1);

renderCart();

}

function renderCart(){

const box=document.getElementById("cartList");

let total=0;
let count=0;

if(!cart.length){

box.innerHTML='<div class="empty">🛒 Cart empty hai.</div>';

}else{

box.innerHTML="";

cart.forEach((x,i)=>{

const itemTotal=x.price*x.quantity;

total+=itemTotal;
count+=x.quantity;

box.innerHTML+=`
<div class="cart-item">

<div>
<strong>${x.name}</strong>
<div style="color:#777;font-size:12px;margin-top:4px">
₹${x.price} × ${x.quantity} = ₹${itemTotal}
</div>
</div>

<div class="qty">
<button onclick="changeQty(${i},-1)">−</button>
<span>${x.quantity}</span>
<button onclick="changeQty(${i},1)">+</button>
</div>

</div>
`;
});

}

document.getElementById("cartTotal").innerText="₹"+total;
document.getElementById("barTotal").innerText="₹"+total;
document.getElementById("cartCount").innerText="🛒 Cart ("+count+")";

document.getElementById("cartBar").style.display=
count?"flex":"none";
}

function openCart(){

document.getElementById("drawer").classList.add("open");
document.getElementById("overlay").style.display="block";
document.body.style.overflow="hidden";

}

function closeCart(){

document.getElementById("drawer").classList.remove("open");
document.getElementById("overlay").style.display="none";
document.body.style.overflow="";

}

async function placeOrder(){

if(!selectedTable){
msg("appMsg","❌ Pehle table select karo.","err");
return;
}

if(!cart.length){
msg("appMsg","❌ Cart empty hai.","err");
return;
}

const {data:sessionData}=await db.auth.getSession();

if(!sessionData.session){

msg("appMsg","❌ Session expire ho gayi. Login dobara karo.","err");

setTimeout(()=>{
location.reload();
},1200);

return;
}

const total=cart.reduce((s,x)=>s+(x.price*x.quantity),0);

const items=cart.map(x=>({
id:x.id,
name:x.name,
price:x.price,
quantity:x.quantity
}));

const btn=document.getElementById("placeBtn");
btn.disabled=true;
btn.innerText="⏳ Placing...";

try{

const {data,error}=await db
.from("orders")
.insert([{
table_number:selectedTable,
items:items,
total_amount:total,
status:"pending",
payment_status:"pending",
waiter_id:waiterId
}])
.select()
.single();

if(error)throw error;

cart=[];
renderCart();
closeCart();

msg(
"appMsg",
"✅ Order #"+data.id+" placed for Table "+selectedTable,
"ok"
);

}catch(error){

console.error(error);

msg(
"appMsg",
"❌ Order place nahi hua: "+error.message,
"err"
);

}finally{

btn.disabled=false;
btn.innerText="✅ Place Order";

}
}

async function logout(){

await db.auth.signOut();

sessionStorage.clear();

location.reload();

}

async function restore(){

const {data}=await db.auth.getSession();

if(!data.session){

document.getElementById("loginScreen").style.display="flex";
document.getElementById("app").style.display="none";
return;
}

/* Session exists: recover waiter info */
waiterId=sessionStorage.getItem("waiter_id");
waiterName=sessionStorage.getItem("waiter_name");

if(!waiterId){
await db.auth.signOut();
return;
}

showApp();

}

restore();

</script>

</body>
</html>
