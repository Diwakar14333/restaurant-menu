<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Waiter Login</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#111,#333);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:22px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    font-size:55px;
    margin-bottom:10px;
}

h1{
    text-align:center;
    font-size:26px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-top:7px;
    margin-bottom:25px;
    font-size:14px;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#111;
}

button{
    cursor:pointer;
}

.login-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#111;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.forgot{
    text-align:center;
    margin-top:18px;
}

.forgot button{
    border:0;
    background:none;
    color:#333;
    text-decoration:underline;
    font-size:14px;
}

.message{
    display:none;
    padding:12px;
    border-radius:9px;
    margin-bottom:15px;
    font-size:14px;
}

.error{
    background:#f8d7da;
    color:#842029;
}

.success{
    background:#d1e7dd;
    color:#0f5132;
}

#forgotBox{
    display:none;
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #eee;
}

.secondary-btn{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#eee;
    color:#222;
}

</style>

</head>

<body>


<div class="login-box">

    <div class="logo">🧑‍🍳</div>

    <h1>Waiter Login</h1>

    <p class="subtitle">
        Restaurant Waiter Panel
    </p>


    <div id="message"
         class="message">
    </div>


    <!-- LOGIN -->

    <form id="loginForm">

        <div class="form-group">

            <label>Waiter ID</label>

            <input
                type="text"
                id="waiterId"
                placeholder="Example: W001"
                autocomplete="username"
                required
            >

        </div>


        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >
            🔐 Login
        </button>

    </form>


    <div class="forgot">

        <button
            type="button"
            onclick="showForgot()"
        >
            Forgot Password?
        </button>

    </div>


    <!-- FORGOT PASSWORD -->

    <div id="forgotBox">

        <h3>🔑 Reset Password</h3>

        <p style="
            color:#777;
            font-size:13px;
            margin:8px 0 15px;
        ">
            Apna Waiter ID enter karo.
            Registered email par reset link bheja jayega.
        </p>


        <div class="form-group">

            <label>Waiter ID</label>

            <input
                type="text"
                id="resetWaiterId"
                placeholder="Example: W001"
            >

        </div>


        <button
            type="button"
            class="login-btn"
            id="resetBtn"
            onclick="sendReset()"
        >
            📧 Send Reset Email
        </button>


        <button
            type="button"
            class="secondary-btn"
            onclick="hideForgot()"
        >
            ← Back to Login
        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://jxjrcjmrkhknltwvzzvr.supabase.co";

const SUPABASE_KEY =
"sb_publishable__Pg5UNoizrSpZB3fRvbARw_fNhHGjvl";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.innerText = text;

    box.className =
        "message " + type;

    box.style.display = "block";

}


function clearMessage(){

    const box =
        document.getElementById("message");

    box.style.display = "none";

}


/* =========================================
   LOGIN
========================================= */

document
.getElementById("loginForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    clearMessage();


    const waiterId =
        document
        .getElementById("waiterId")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    if(!waiterId){

        showMessage(
            "❌ Waiter ID enter karo.",
            "error"
        );

        return;
    }


    if(!password){

        showMessage(
            "❌ Password enter karo.",
            "error"
        );

        return;
    }


    const btn =
        document.getElementById("loginBtn");


    btn.disabled = true;

    btn.innerText =
        "⏳ Logging in...";


    try{


        /*
        =========================================
        EDGE FUNCTION
        =========================================
        */

        const response =
            await fetch(
                SUPABASE_URL +
                "/functions/v1/waiter-login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY
                    },

                    body:JSON.stringify({

                        waiter_id:
                            waiterId,

                        password:
                            password

                    })
                }
            );


        const result =
            await response.json();


        console.log(
            "Waiter login:",
            result
        );


        if(
            !response.ok ||
            !result.success
        ){

            showMessage(
                "❌ " +
                (
                    result.message ||
                    "Waiter ID ya password galat hai."
                ),
                "error"
            );

            btn.disabled = false;

            btn.innerText =
                "🔐 Login";

            return;
        }


        /*
        =========================================
        SAVE WAITER INFORMATION
        =========================================
        */

        sessionStorage.setItem(
            "waiter_id",
            result.waiter.waiter_id
        );


        sessionStorage.setItem(
            "waiter_name",
            result.waiter.name || ""
        );


        /*
        =========================================
        SAVE SESSION
        =========================================
        */

        if(result.session){

            localStorage.setItem(
                "waiter_session",
                JSON.stringify(
                    result.session
                )
            );

        }


        showMessage(
            "✅ Login successful! Opening waiter panel...",
            "success"
        );


        setTimeout(function(){

            window.location.href =
                "waiter-dashboard.html";

        },700);


    }catch(error){

        console.error(error);

        showMessage(
            "❌ Server se connection nahi ho raha: " +
            error.message,
            "error"
        );

        btn.disabled = false;

        btn.innerText =
            "🔐 Login";

    }

});


/* =========================================
   FORGOT PASSWORD
========================================= */

function showForgot(){

    clearMessage();

    document
    .getElementById("loginForm")
    .style.display = "none";

    document
    .querySelector(".forgot")
    .style.display = "none";

    document
    .getElementById("forgotBox")
    .style.display = "block";

}


function hideForgot(){

    clearMessage();

    document
    .getElementById("forgotBox")
    .style.display = "none";

    document
    .getElementById("loginForm")
    .style.display = "block";

    document
    .querySelector(".forgot")
    .style.display = "block";

}


/* =========================================
   FORGOT PASSWORD
========================================= */

async function sendReset(){

    clearMessage();


    const waiterId =
        document
        .getElementById("resetWaiterId")
        .value
        .trim();


    if(!waiterId){

        showMessage(
            "❌ Waiter ID enter karo.",
            "error"
        );

        return;
    }


    const btn =
        document.getElementById("resetBtn");


    btn.disabled = true;

    btn.innerText =
        "⏳ Checking...";


    try{


        /*
        =========================================
        GET WAITER EMAIL
        =========================================
        */

        const {
            data,
            error
        } = await db
        .from("waiters")
        .select("email")
        .eq("waiter_id", waiterId)
        .maybeSingle();


        /*
        IMPORTANT:
        Agar email column waiters me nahi hai,
        to yahan error aayega.
        */

        if(error){

            console.error(error);

            showMessage(
                "❌ Waiter reset setup me problem hai: " +
                error.message,
                "error"
            );

            btn.disabled = false;

            btn.innerText =
                "📧 Send Reset Email";

            return;
        }


        if(!data || !data.email){

            showMessage(
                "❌ Is Waiter ID ke liye email nahi mila.",
                "error"
            );

            btn.disabled = false;

            btn.innerText =
                "📧 Send Reset Email";

            return;
        }


        /*
        =========================================
        REDIRECT URL
        =========================================
        */

        const redirectUrl =
            window.location.origin +
            window.location.pathname
            .replace(
                "waiter.html",
                "reset-password.html"
            );


        /*
        =========================================
        SUPABASE RESET
        =========================================
        */

        const {
            error:resetError
        } =
        await db.auth.resetPasswordForEmail(
            data.email,
            {
                redirectTo:
                    redirectUrl
            }
        );


        if(resetError){

            console.error(resetError);

            showMessage(
                "❌ Reset email nahi bheja gaya: " +
                resetError.message,
                "error"
            );

            btn.disabled = false;

            btn.innerText =
                "📧 Send Reset Email";

            return;
        }


        showMessage(
            "✅ Reset email bhej diya gaya. Inbox/spam check karo.",
            "success"
        );


        btn.disabled = false;

        btn.innerText =
            "📧 Send Reset Email";


    }catch(error){

        console.error(error);

        showMessage(
            "❌ Reset error: " +
            error.message,
            "error"
        );

        btn.disabled = false;

        btn.innerText =
            "📧 Send Reset Email";

    }

}

</script>

</body>
</html>
